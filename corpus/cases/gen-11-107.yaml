edits:
  collections/transforms/mbql_transform/monthly_order_summary__orders_per_month.yaml: |
    name: "Monthly Order Summary: orders per month"
    entity_id: 57lhlfQkXUllMLTaY9IRu
    transform_id: 1fNzUt_CgppinjPk7pGKH
    creator_id: admin@example.com
    description: "Cases: two orders in one month are counted and summed; the next month stands alone."
    inputs:
      - table:
          schema: PUBLIC
          name: ORDERS
        format: sql
        sql: SELECT 1 AS id
    expectations:
      - type: empty
        name: no negative revenue
        sql: SELECT * FROM transforms.monthly_order_summary WHERE sum < 0
    serdes/meta:
      - model: TransformTest
  collections/transforms/native_transform/product_revenue_report__category_totals.yaml: |
    name: "Product Revenue Report: category totals"
    entity_id: aRvM7DLesF1fOV4kRHidq
    transform_id: 7JwIkkAG-06-nsl4jzsaq
    creator_id: admin@example.com
    description: "Cases: two orders of one category are summed and averaged; a category with one order stands alone."
    inputs:
      - table:
          name: orders
        format: rows
        columns:
          - name: id
            cast_type: INTEGER
          - name: product_id
            cast_type: INTEGER
          - name: total
            cast_type: DOUBLE PRECISION
        rows:
          - id: 1
            product_id: 1
            total: 10
          - id: 2
            product_id: 1
            total: 30
          - id: 3
            product_id: 2
            total: 25
      - table:
          name: products
        format: sql
        sql: SELECT 1 AS id, 'Gadget' AS category UNION ALL SELECT 2, 'Widget'
    expectations:
      - type: empty
        name: generated
        sql: SELECT * FROM "public".PEOPLE "T" WHERE 1 = 1 [[AND 1 IN (SELECT 1 FROM "transforms"."daily_order_summary" "T")]]
    serdes/meta:
      - model: TransformTest
