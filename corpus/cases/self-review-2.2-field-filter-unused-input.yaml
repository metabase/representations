description: A transform filters by a field-filter tag on products.category, and its test gives an input for products too.
origin: "self-review of #40 at 6405d92, section 2.2"
known: |-
  collections/transforms/daily_order_summary.yaml: only the lint reads public.products
  collections/transforms/daily_order_summary/daily_order_summary__orders_per_day.yaml: Metabase refuses it with transform-test.unused-inputs ("Test input(s) declared for table(s) the transform does not read: public.products. Remove them."); the lint reports no unused-input
edits:
  collections/transforms/daily_order_summary.yaml: |
    name: Daily Order Summary
    entity_id: 7XqqzlsonSq4KFyOvtrAm
    creator_id: admin@example.com
    source_database_id: Sample Postgres
    source:
      type: query
      query:
        lib/type: mbql/query
        database: Sample Postgres
        stages:
          - lib/type: mbql.stage/native
            native: SELECT created_at, total FROM orders WHERE {{p}}
            template-tags:
              - type: dimension
                name: p
                id: bb000001-0000-0000-0000-000000000001
                display-name: p
                dimension:
                  - field
                  - {}
                  - - Sample Postgres
                    - public
                    - products
                    - category
                widget-type: date/all-options
    target:
      database: Sample Postgres
      type: table
      schema: transforms
      name: daily_order_summary
    tags:
      - entity_id: qJU4-opN0IFLKDEdmXiYh
        position: 0
        tag_id: dUW7nvQHQBdA0Rx0gJckI
      - entity_id: hTtmHg0mopz6qzrEDukSm
        position: 1
        tag_id: 1uWng5tP1gyxr44PJ5FPb
    serdes/meta:
      - model: Transform
  collections/transforms/daily_order_summary/daily_order_summary__orders_per_day.yaml: |
    name: "Daily Order Summary: orders per day"
    entity_id: LfXNcELKeCrAfD4htCFDH
    transform_id: 7XqqzlsonSq4KFyOvtrAm
    creator_id: admin@example.com
    description: "Cases: two orders on one day are counted and summed; a later day stands alone."
    inputs:
      - table:
          name: orders
        format: rows
        columns:
          - name: created_at
            cast_type: TIMESTAMP
          - name: total
            cast_type: DOUBLE PRECISION
        rows:
          - created_at: "2024-01-01 09:00:00"
            total: 10
          - created_at: "2024-01-01 17:30:00"
            total: 15
          - created_at: "2024-01-02 12:00:00"
            total: 20
      - table:
          schema: public
          name: products
        format: rows
        columns:
          - name: category
            cast_type: TEXT
        rows:
          - category: Gadget
    expectations:
      - type: empty
        name: one row per day
        sql: SELECT order_date FROM transforms.daily_order_summary GROUP BY order_date HAVING COUNT(*) > 1
      - type: empty
        name: no negative revenue
        sql: SELECT * FROM transforms.daily_order_summary WHERE total_revenue < 0
    serdes/meta:
      - model: TransformTest
