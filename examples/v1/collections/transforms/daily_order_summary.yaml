    "lib/type": mbql/query
    database: Sample Postgres
    stages:
      - "lib/type": mbql.stage/native
        native: |-
          SELECT
            DATE_TRUNC('day', created_at) AS order_date,
            COUNT(*) AS order_count,
            SUM(total) AS total_revenue
          FROM orders
          GROUP BY 1
