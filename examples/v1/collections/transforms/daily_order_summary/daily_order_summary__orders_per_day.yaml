name: 'Daily Order Summary: orders per day'
entity_id: LfXNcELKeCrAfD4htCFDH
transform_id: 7XqqzlsonSq4KFyOvtrAm
creator_id: admin@example.com
description: 'Cases: two orders on one day are counted and summed; a later day stands alone.'
inputs:
- table:
    name: orders
  format: rows
  columns:
  - name: created_at
    cast_type: TIMESTAMP
  - name: total
    cast_type: DOUBLE PRECISION
  rows:
  - created_at: '2024-01-01 09:00:00'
    total: 10.0
  - created_at: '2024-01-01 17:30:00'
    total: 15.0
  - created_at: '2024-01-02 12:00:00'
    total: 20.0
expectations:
- type: empty
  name: one row per day
  sql: SELECT order_date FROM transforms.daily_order_summary GROUP BY order_date HAVING COUNT(*) > 1
- type: empty
  name: no negative revenue
  sql: SELECT * FROM transforms.daily_order_summary WHERE total_revenue < 0
serdes/meta:
- model: TransformTest
