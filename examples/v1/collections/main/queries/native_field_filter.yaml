name: "Native Query - Field Filter and Temporal Unit"
entity_id: sk02d7sPWAk2TYH2Y7JhZ
creator_id: admin@example.com
display: line
database_id: Sample Database
dataset_query:
  database: Sample Database
  type: native
  native:
    query: |-
      SELECT {{created_at}} AS period, p.CATEGORY, COUNT(*) AS cnt
      FROM ORDERS o
      JOIN PRODUCTS p ON o.PRODUCT_ID = p.ID
      WHERE {{category_filter}}
        AND {{date_filter}}
      GROUP BY {{created_at}}, p.CATEGORY
    template-tags:
      category_filter:
        type: dimension
        name: category_filter
        id: bb000001-0000-0000-0000-000000000001
        display-name: Category
        dimension:
        - field
        - - Sample Database
          - PUBLIC
          - PRODUCTS
          - CATEGORY
        - null
        widget-type: string/=
      date_filter:
        type: dimension
        name: date_filter
        id: bb000002-0000-0000-0000-000000000002
        display-name: Order Date
        dimension:
        - field
        - - Sample Database
          - PUBLIC
          - ORDERS
          - CREATED_AT
        - null
        widget-type: date/range
      created_at:
        type: temporal-unit
        name: created_at
        id: bb000003-0000-0000-0000-000000000003
        display-name: Group By
        default: month
visualization_settings: {}
serdes/meta:
- id: sk02d7sPWAk2TYH2Y7JhZ
  label: native_field_filter
  model: Card
