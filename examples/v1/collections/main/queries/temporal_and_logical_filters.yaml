      - - ">"
        - - field
          - - Sample Database
            - PUBLIC
            - ORDERS
            - CREATED_AT
          - null
        - - absolute-datetime
          - '2024-01-01'
          - day
      - - "<"
        - - field
          - - Sample Database
            - PUBLIC
            - ORDERS
            - CREATED_AT
          - null
        - - relative-datetime
          - 0
          - day
    - - not
      - - is-null
        - - field
          - - Sample Database
            - PUBLIC
            - ORDERS
            - DISCOUNT
          - null
    limit: 20
