$schema: https://json-schema.org/draft/2020-12/schema
title: Segment
description: >
  A saved filter definition. Segments allow reusable filters that can be
  applied across multiple questions and dashboards. Stored under their table's
  directory: databases/{db}/schemas/{schema}/tables/{table}/segments/.
type: object
required:
  - name
  - entity_id
  - creator_id
  - definition
  - serdes/meta
properties:
  name:
    type: string
    description: Segment name
  entity_id:
    type: string
    description: NanoID identifier (21 characters, alphabet A-Za-z0-9_-)
    pattern: "^[A-Za-z0-9_-]{21}$"
  creator_id:
    type: string
    description: User FK (email address)
    format: email
  description:
    type:
      - string
      - "null"
    description: Human-readable description
  archived:
    type: boolean
    description: Whether archived
    default: false
  definition:
    type: object
    description: >
      Filter definition specifying the source table and filter criteria.
      Uses pMBQL format with database, type, and query containing
      source-table and filter.
    required:
      - database
      - type
      - query
    properties:
      database:
        type: string
        description: Database FK (database name)
      type:
        type: string
        enum:
          - query
      query:
        type: object
        required:
          - source-table
          - filter
        properties:
          source-table:
            type: array
            description: Table FK [database, schema, table]
            items:
              type:
                - string
                - "null"
            minItems: 3
            maxItems: 3
          filter:
            description: >
              MBQL filter clause. General form: [operator, field_ref, value].
              Compound filters: [and/or, ...clauses].
              Field reference: [field, [db, schema, table, field], options].
              Operators: =, !=, <, >, <=, >=, is-null, not-null,
              contains, starts-with, ends-with, between.
  created_at:
    type: string
    description: ISO 8601 timestamp
    format: date-time
  serdes/meta:
    type: array
    description: Identity path for serialization
    items:
      type: object
      required:
        - id
        - model
      properties:
        id:
          type: string
          description: Entity identifier (matches entity_id)
        label:
          type: string
          description: Slugified name
        model:
          type: string
          const: Segment
