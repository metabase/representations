$schema: https://json-schema.org/draft/2020-12/schema
title: OsiAiContext
description: >
  AI context of one item: instructions, synonyms and example questions that
  Metabot uses for it. Stored as ai_context.yaml in the item's folder,
  for example metrics/{metric_slug}.metric/ai_context.yaml.
type: object
required:
  - entity_type
  - entity_local_id
  - ai_context
  - serdes/meta
properties:
  entity_type:
    type: string
    description: Kind of the item described
    enum: [card, table, measure, segment]
  entity_local_id:
    description: >
      The item described: its entity_id (card, measure, segment), or its
      Table FK [database, schema, table] (table).
    oneOf:
      - $ref: "common/id.yaml#/$defs/entity_id"
      - $ref: "common/id.yaml#/$defs/table_id"
  ai_context:
    type: object
    description: The AI context
    properties:
      instructions:
        type: [string, "null"]
        description: Instructions for Metabot about the item
      synonyms:
        type: array
        description: Other names for the item
        items: { type: string }
        maxItems: 50
      examples:
        type: array
        description: Example questions the item answers
        items: { type: string }
        maxItems: 50
    additionalProperties: false
  created_at:
    type: string
    description: ISO 8601 timestamp
    format: date-time
  updated_at:
    type: string
    description: ISO 8601 timestamp
    format: date-time
  serdes/meta:
    type: array
    description: Identity path for serialization
    items:
      type: object
      required: [model]
      properties:
        model:
          type: string
          const: OsiAiContext
additionalProperties: true
