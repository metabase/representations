$schema: https://json-schema.org/draft/2020-12/schema
title: Custom Viz Plugin
description: >
  The `custom_viz_plugin.yaml` at the root of a custom viz plugin's directory,
  `custom_viz_plugins/<directory>/custom_viz_plugin.yaml`: the plugin's own
  serialized entity, identified by its `entity_id` like every other. Its
  `identifier` must be the manifest's `name`, which this file can't check.
  The directory's name is not significant.
type: object
required:
  - entity_id
  - identifier
  - serdes/meta
properties:
  entity_id:
    $ref: "common/id.yaml#/$defs/entity_id"
  identifier:
    type: string
    description: >
      The plugin's identifier: letters, digits, spaces, `.`, `_` and `-`,
      starting with a letter or digit and not ending with a space. It names
      the `custom:<identifier>` display type, and
      `:` separates the parts of `custom:<identifier>:<setting>` keys.
    pattern: '^[A-Za-z0-9]([A-Za-z0-9 ._-]*[A-Za-z0-9._-])?$'
  created_at:
    type: string
    format: date-time
    description: Creation timestamp (ISO 8601)
  serdes/meta:
    type: array
    description: Identity path for serialization, a single `CustomVizPlugin` entry
    minItems: 1
    maxItems: 1
    items:
      type: object
      required:
        - model
      properties:
        id:
          type: string
          description: Entity identifier (matches entity_id)
        label:
          type: string
          description: The plugin's identifier, slugified
        model:
          type: string
          const: CustomVizPlugin
additionalProperties: true
