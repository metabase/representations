$schema: https://json-schema.org/draft/2020-12/schema
title: Custom Viz Plugin
description: >
  The `custom_viz_plugin.yaml` at the root of a custom viz plugin's directory,
  `custom_viz_plugins/<identifier>/custom_viz_plugin.yaml`: the plugin's own
  serialized entity. Unlike other entities it has no `entity_id`: its
  `identifier` is its identity, and must equal the `name` in the manifest
  inside `bundle`; an instance checks that on import.
type: object
required:
  - identifier
  - bundle
  - serdes/meta
properties:
  identifier:
    type: string
    description: >
      The plugin's identifier, the display type cards use as
      `custom:<identifier>`. No `:` (it separates the parts of
      `custom:<identifier>:<setting>` keys), no `/`, `\` or whitespace (it is
      the directory's name), and no leading `.`.
    pattern: '^[^:/\\\s.][^:/\\\s]*$'
  bundle:
    type: string
    contentEncoding: base64
    contentMediaType: application/gzip
    description: >
      The plugin's tar.gz exactly as `npx @metabase/custom-viz pack` writes
      it, base64-encoded: `metabase-plugin.json` at the archive root,
      `dist/index.js`, and the assets under `dist/assets/`. The pattern
      checks for single-line base64 that begins with the gzip magic bytes.
    pattern: '^H4sI[A-Za-z0-9+/]*={0,2}$'
  enabled:
    type: boolean
    description: >
      Whether cards and dashboards may use the plugin. `false` when absent.
  created_at:
    type: string
    format: date-time
    description: Creation timestamp (ISO 8601)
  serdes/meta:
    type: array
    description: Identity path for serialization, a single `CustomVizPlugin` entry
    minItems: 1
    maxItems: 1
    items:
      type: object
      required:
        - model
      properties:
        id:
          type: string
          description: Entity identifier (matches identifier)
        label:
          type: string
          description: The plugin's identifier
        model:
          type: string
          const: CustomVizPlugin
additionalProperties: true
