$schema: https://json-schema.org/draft/2020-12/schema
title: FieldUserSettings
description: User-customized settings for a field.
type: object
required:
  - serdes/meta
properties:
  field_id:
    description: The Field these settings belong to
    $ref: "common/id.yaml#/$defs/field_id"
  serdes/meta:
    type: array
    items:
      type: object
      required: [model]
      properties:
        id: { type: string }
        model: { type: string, enum: [Database, Schema, Table, Field, FieldUserSettings] }
additionalProperties: true
