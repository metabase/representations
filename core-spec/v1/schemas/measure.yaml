$schema: https://json-schema.org/draft/2020-12/schema
title: Measure
description: >
  A saved aggregation definition. Measures allow reusable aggregations that
  can be applied across multiple questions and dashboards. Stored under their
  table's directory: databases/{db}/schemas/{schema}/tables/{table}/measures/.
type: object
required:
  - name
  - entity_id
  - creator_id
  - definition
  - serdes/meta
properties:
  name:
    type: string
    description: Measure name
  entity_id:
    type: string
    description: NanoID identifier (21 characters, alphabet A-Za-z0-9_-)
    pattern: "^[A-Za-z0-9_-]{21}$"
  creator_id:
    type: string
    description: User FK (email address)
    format: email
  description:
    type:
      - string
      - "null"
    description: Human-readable description
  archived:
    type: boolean
    description: Whether archived
    default: false
  definition:
    type: object
    description: >
      Aggregation definition in pMBQL format with database, type, and
      query containing source-table and aggregation.
    required:
      - database
      - type
      - query
    properties:
      database:
        type: string
        description: Database FK (database name)
      type:
        type: string
        enum:
          - query
      query:
        type: object
        required:
          - aggregation
          - source-table
        properties:
          source-table:
            type: array
            description: Table FK [database, schema, table]
            items:
              type:
                - string
                - "null"
            minItems: 3
            maxItems: 3
          aggregation:
            type: array
            description: >
              Aggregation clauses. Each clause is [function, ...args].
              Functions: count, sum, avg, min, max, distinct, cum-count,
              cum-sum, stddev, var, median, percentile, count-where,
              sum-where, share. Can also reference other saved measures
              via [measure, entity_id].
            items:
              type: array
  created_at:
    type: string
    description: ISO 8601 timestamp
    format: date-time
  serdes/meta:
    type: array
    description: Identity path for serialization
    items:
      type: object
      required:
        - id
        - model
      properties:
        id:
          type: string
          description: Entity identifier (matches entity_id)
        label:
          type: string
          description: Slugified name
        model:
          type: string
          const: Measure
