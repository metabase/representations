$schema: https://json-schema.org/draft/2020-12/schema
title: Measure
description: >
  A saved aggregation definition. Measures allow reusable aggregations that
  can be applied across multiple questions and dashboards. Stored under their
  table's directory: databases/{db}/schemas/{schema}/tables/{table}/measures/.
type: object
required:
  - name
  - entity_id
  - creator_id
  - definition
  - serdes/meta
properties:
  name:
    type: string
    description: Measure name
  entity_id:
    $ref: "common.yaml#/$defs/entity_id"
  creator_id:
    $ref: "common.yaml#/$defs/user_id"
  description:
    type:
      - string
      - "null"
    description: Human-readable description
  archived:
    type: boolean
    description: Whether archived
    default: false
  definition:
    description: >
      Aggregation definition. Must use type: query with a physical table
      source and at least one aggregation clause.
    allOf:
      - $ref: "query.yaml"
      - type: object
        required:
          - database
          - type
          - query
        properties:
          type:
            const: query
          query:
            type: object
            required:
              - source-table
              - aggregation
            properties:
              source-table:
                description: >
                  Table FK [database, schema, table]. Measures must reference
                  a physical table, not a saved card/model.
                $ref: "common.yaml#/$defs/table_id"
  created_at:
    type: string
    description: ISO 8601 timestamp
    format: date-time
  serdes/meta:
    type: array
    description: Identity path for serialization
    items:
      type: object
      required:
        - id
        - model
      properties:
        id:
          type: string
          description: Entity identifier (matches entity_id)
        label:
          type: string
          description: Slugified name
        model:
          type: string
          const: Measure
