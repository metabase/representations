$schema: https://json-schema.org/draft/2020-12/schema
title: Document
description: >
  A rich document that can contain text, headings, lists, embedded
  cards/queries, and references to other entities. Documents use a
  ProseMirror-compatible tree structure. Cards can be nested under a
  document via card.document_id, similar to how cards nest under dashboards.
type: object
required:
  - name
  - entity_id
  - creator_id
  - document
  - serdes/meta
properties:
  name:
    type: string
    description: Document name (1-254 characters)
  entity_id:
    $ref: "common.yaml#/$defs/entity_id"
  creator_id:
    $ref: "common.yaml#/$defs/user_id"
  document:
    description: >
      Document content as a ProseMirror AST. The root node has type "doc"
      with an array of content nodes.
    $ref: "#/$defs/node"
  description:
    type:
      - string
      - "null"
    description: Human-readable description
  content_type:
    type: string
    description: Document content MIME type
    const: "application/json+vnd.prose-mirror"
  collection_id:
    description: Collection FK, null for root collection
    oneOf:
      - $ref: "common.yaml#/$defs/entity_id"
      - type: "null"
  collection_position:
    type:
      - integer
      - "null"
    description: Position within collection (for pinning)
  archived:
    type: boolean
    description: Whether archived
    default: false
  archived_directly:
    type: boolean
    description: Archived directly vs. inherited
    default: false
  public_uuid:
    type:
      - string
      - "null"
    description: Public sharing UUID
    format: uuid
  made_public_by_id:
    description: User who made this public
    oneOf:
      - $ref: "common.yaml#/$defs/user_id"
      - type: "null"
  view_count:
    type: integer
    description: Number of times viewed
    default: 0
  created_at:
    type: string
    description: ISO 8601 timestamp
    format: date-time
  serdes/meta:
    type: array
    description: Identity path for serialization
    items:
      type: object
      required:
        - id
        - model
      properties:
        id:
          type: string
          description: Entity identifier (matches entity_id)
        label:
          type: string
          description: Slugified name
        model:
          type: string
          const: Document

$defs:
  node:
    type: object
    description: >
      A ProseMirror document node (recursive). Nodes form a tree with
      type-specific structure enforced via if/then.
    required:
      - type
    properties:
      type:
        type: string
        description: Node type name
      content:
        type: array
        description: Child nodes (recursive)
        items:
          $ref: "#/$defs/node"
      attrs:
        type: object
        description: Node-specific attributes
      text:
        type: string
        description: Text content (only for text nodes)
      marks:
        type: array
        description: Inline formatting marks on text nodes
        items:
          $ref: "#/$defs/mark"
    allOf:
      # --- cardEmbed: requires attrs.id as [{model: Card, id: entity_id}] ---
      - if:
          properties:
            type:
              const: cardEmbed
        then:
          required:
            - attrs
          properties:
            attrs:
              type: object
              required:
                - id
              properties:
                id:
                  type: array
                  description: "Card reference path"
                  items:
                    type: object
                    required:
                      - model
                      - id
                    properties:
                      model:
                        type: string
                        const: Card
                      id:
                        $ref: "common.yaml#/$defs/entity_id"
                    additionalProperties: false
                  minItems: 1
                  maxItems: 1
                name:
                  type:
                    - string
                    - "null"
              additionalProperties: false
      # --- heading: requires attrs.level 1-6 ---
      - if:
          properties:
            type:
              const: heading
        then:
          required:
            - attrs
          properties:
            attrs:
              type: object
              required:
                - level
              properties:
                level:
                  type: integer
                  minimum: 1
                  maximum: 6
              additionalProperties: false
      # --- image: requires attrs.src ---
      - if:
          properties:
            type:
              const: image
        then:
          required:
            - attrs
          properties:
            attrs:
              type: object
              required:
                - src
              properties:
                src:
                  type: string
                alt:
                  type:
                    - string
                    - "null"
                title:
                  type:
                    - string
                    - "null"
              additionalProperties: false
      # --- smartLink: requires attrs.entityId and attrs.model ---
      - if:
          properties:
            type:
              const: smartLink
        then:
          required:
            - attrs
          properties:
            attrs:
              type: object
              required:
                - entityId
                - model
              properties:
                entityId:
                  type: array
                  description: Entity reference path
                  items:
                    type: object
                    required:
                      - model
                      - id
                    properties:
                      model:
                        type: string
                      id:
                        type: string
                    additionalProperties: false
                model:
                  type: string
                  description: Entity model (card, dashboard, collection, etc.)
              additionalProperties: false
      # --- text: requires text field, no attrs ---
      - if:
          properties:
            type:
              const: text
        then:
          required:
            - text

  mark:
    type: object
    description: Inline formatting mark on a text node.
    required:
      - type
    properties:
      type:
        type: string
        description: "Mark type: bold, italic, code, link, underline, strike"
      attrs:
        type: object
        description: Mark attributes (e.g., href for link marks)
        properties:
          href:
            type: string
        additionalProperties: true
