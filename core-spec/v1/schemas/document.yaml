$schema: https://json-schema.org/draft/2020-12/schema
title: Document
description: >
  A rich document that can contain text, headings, lists, embedded
  cards/queries, and references to other entities. Documents use a
  ProseMirror-compatible tree structure. Cards can be nested under a
  document via card.document_id, similar to how cards nest under dashboards.
type: object
required:
  - name
  - entity_id
  - creator_id
  - document
  - serdes/meta
properties:
  name:
    type: string
    description: Document name (1-254 characters)
  entity_id:
    $ref: "common.yaml#/$defs/entity_id"
  creator_id:
    $ref: "common.yaml#/$defs/user_id"
  description:
    type:
      - string
      - "null"
    description: Human-readable description
  document:
    description: >
      Document content as a ProseMirror AST. The root node has type "doc"
      with an array of content nodes.
    $ref: "#/$defs/node"
  content_type:
    type: string
    description: Document content MIME type
    const: "application/json+vnd.prose-mirror"
  collection_id:
    description: Collection FK, null for root collection
    oneOf:
      - $ref: "common.yaml#/$defs/entity_id"
      - type: "null"
  collection_position:
    type:
      - integer
      - "null"
    description: Position within collection (for pinning)
  archived:
    type: boolean
    description: Whether archived
    default: false
  archived_directly:
    type: boolean
    description: Archived directly vs. inherited
    default: false
  public_uuid:
    type:
      - string
      - "null"
    description: Public sharing UUID
    format: uuid
  made_public_by_id:
    description: User who made this public
    oneOf:
      - $ref: "common.yaml#/$defs/user_id"
      - type: "null"
  view_count:
    type: integer
    description: Number of times viewed
    default: 0
  created_at:
    type: string
    description: ISO 8601 timestamp
    format: date-time
  serdes/meta:
    type: array
    description: Identity path for serialization
    items:
      type: object
      required:
        - id
        - model
      properties:
        id:
          type: string
          description: Entity identifier (matches entity_id)
        label:
          type: string
          description: Slugified name
        model:
          type: string
          const: Document

$defs:
  node:
    type: object
    description: >
      A ProseMirror document node (recursive). Nodes form a tree: each node
      has a type and optionally content (child nodes), attrs (node-specific
      properties), text (for text nodes), and marks (inline formatting).

      Common node types:
        doc           — root node, always the top-level type
        paragraph     — text block
        text          — inline text content (has text property)
        heading       — heading block (attrs: level 1-6)
        blockquote    — quoted text block
        codeBlock     — code block
        bulletList    — unordered list (contains listItem nodes)
        orderedList   — ordered list (contains listItem nodes)
        listItem      — list item (contains paragraph or other blocks)
        image         — image embed (attrs: src, alt, title)
        cardEmbed     — embedded card/query (attrs: id = card entity_id)
        smartLink     — reference to another entity (attrs: entityId, model)
        table         — data table (contains tableRow nodes)
        hardBreak     — line break within a paragraph

      Card embeds reference cards by entity_id in the serialized form.
    required:
      - type
    properties:
      type:
        type: string
        description: Node type name
      content:
        type: array
        description: Child nodes (recursive)
        items:
          $ref: "#/$defs/node"
      attrs:
        type: object
        description: >
          Node-specific attributes. Varies by type:
            heading: {level: 1-6}
            image: {src, alt, title}
            cardEmbed: {id (card entity_id), name}
            smartLink: {entityId, model}
        additionalProperties: true
      text:
        type: string
        description: Text content (only for text nodes)
      marks:
        type: array
        description: >
          Inline formatting marks applied to text nodes:
          bold, italic, code, link, underline, strike.
        items:
          type: object
          required:
            - type
          properties:
            type:
              type: string
              description: Mark type
            attrs:
              type: object
              description: Mark attributes (e.g., href for link marks)
              additionalProperties: true
