$schema: https://json-schema.org/draft/2020-12/schema
title: Parameter
description: >
  A filter control parameter for cards and dashboards. Parameters allow
  users to interactively filter data via UI controls.

type: object
required:
  - id
  - name
  - slug
  - type
properties:
  id:
    type: string
    description: UUID identifier
    format: uuid
  name:
    type: string
    description: Display name
  slug:
    type: string
    description: URL-friendly identifier
  type:
    type: string
    description: >
      Filter widget type: string/=, string/!=, string/contains,
      string/starts-with, string/ends-with, number/=, number/!=,
      number/>=, number/<=, number/between, date/single, date/range,
      date/month-year, date/quarter-year, date/relative, date/all-options,
      boolean/=, temporal-unit
  default:
    description: Default value (type depends on filter type)
  required:
    type: boolean
    description: Whether a value is required
  sectionId:
    type: string
    description: >
      UI section grouping. Normally the first part of the parameter type
      (e.g., "date" for date/range, "string" for string/=). Set to "id"
      for number/= or string/= to display in a special ID section.
  temporal_units:
    type: array
    description: Allowed temporal units (for temporal-unit type)
    items:
      type: string
      enum:
        - minute
        - hour
        - day
        - week
        - month
        - quarter
        - year
  values_query_type:
    type: string
    enum:
      - list
      - search
      - none
  values_source_type:
    type:
      - string
      - "null"
    enum:
      - null
      - card
      - static-list
  values_source_config:
    type: object
    description: >
      Source configuration. For static-list: {values: [[val, label], ...]}.
      For card: {card_id, value_field, label_field}.
    properties:
      values:
        type: array
        description: Static list of [value, label] pairs
      card_id:
        type: string
        description: Card entity_id to source values from
      value_field:
        description: Field clause for extracting values from card results
      label_field:
        description: Field clause for extracting labels from card results
    additionalProperties: false
