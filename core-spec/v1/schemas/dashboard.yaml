$schema: https://json-schema.org/draft/2020-12/schema
title: Dashboard
description: >
  A collection of cards arranged in a grid layout. Dashboards contain
  dashboard cards (dashcards), parameters for filtering, and optional tabs.
type: object
required:
  - name
  - entity_id
  - creator_id
  - serdes/meta
properties:
  name:
    type: string
    description: Dashboard name
  entity_id:
    type: string
    description: NanoID identifier (21 characters, alphabet A-Za-z0-9_-)
    pattern: "^[A-Za-z0-9_-]{21}$"
  creator_id:
    type: string
    description: User FK (email address)
    format: email
  description:
    type:
      - string
      - "null"
    description: Human-readable description
  archived:
    type: boolean
    description: Whether archived
    default: false
  archived_directly:
    type: boolean
    description: Archived directly vs. inherited
    default: false
  collection_id:
    type:
      - string
      - "null"
    description: Collection FK (entity_id), null for root collection
  collection_position:
    type:
      - integer
      - "null"
    description: Position within collection
  position:
    type:
      - integer
      - "null"
    description: Display position
  auto_apply_filters:
    type: boolean
    description: Auto-apply filter changes
    default: true
  width:
    type: string
    description: Dashboard width
    enum:
      - fixed
      - full
    default: fixed
  enable_embedding:
    type: boolean
    description: Embedding enabled
    default: false
  embedding_params:
    type:
      - object
      - "null"
    description: Embedding parameter configuration
  embedding_type:
    type:
      - string
      - "null"
    description: Embedding type
    enum:
      - null
      - sdk
      - standalone
  public_uuid:
    type:
      - string
      - "null"
    description: Public sharing UUID
    format: uuid
  made_public_by_id:
    type:
      - string
      - "null"
    description: User FK (email) who made this public
  show_in_getting_started:
    type: boolean
    description: Show in getting started section
    default: false
  caveats:
    type:
      - string
      - "null"
    description: Known limitations
  points_of_interest:
    type:
      - string
      - "null"
    description: Noteworthy features
  initially_published_at:
    type:
      - string
      - "null"
    description: ISO 8601 timestamp of initial publication
    format: date-time
  parameters:
    type: array
    description: Dashboard filter parameters
    items:
      $ref: "#/$defs/parameter"
  tabs:
    type: array
    description: Dashboard tabs for organizing content
    items:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        entity_id:
          type: string
        position:
          type: integer
  dashcards:
    type: array
    description: Dashboard cards placed on the grid
    items:
      $ref: "#/$defs/dashcard"
  created_at:
    type: string
    description: ISO 8601 timestamp
    format: date-time
  serdes/meta:
    type: array
    description: Identity path for serialization
    items:
      type: object
      required:
        - id
        - model
      properties:
        id:
          type: string
          description: Entity identifier (matches entity_id)
        label:
          type: string
          description: Slugified name
        model:
          type: string
          const: Dashboard

$defs:
  parameter:
    type: object
    description: A filter control parameter
    required:
      - id
      - name
      - slug
      - type
    properties:
      id:
        type: string
        description: UUID identifier
        format: uuid
      name:
        type: string
        description: Display name
      slug:
        type: string
        description: URL-friendly identifier
      type:
        type: string
        description: >
          Filter widget type: string/=, string/!=, string/contains,
          string/starts-with, string/ends-with, number/=, number/!=,
          number/>=, number/<=, number/between, date/single, date/range,
          date/month-year, date/quarter-year, date/relative, date/all-options,
          temporal-unit, id
      default:
        description: Default value (type depends on filter type)
      required:
        type: boolean
        description: Whether a value is required
      sectionId:
        type: string
        description: Parameter section grouping
      temporal_units:
        type: array
        description: Allowed temporal units (for temporal-unit type)
        items:
          type: string
          enum:
            - minute
            - hour
            - day
            - week
            - month
            - quarter
            - year
      values_query_type:
        type: string
        enum:
          - list
          - search
          - none
      values_source_type:
        type:
          - string
          - "null"
        enum:
          - null
          - card
          - static-list
      values_source_config:
        type: object
        additionalProperties: true

  dashcard:
    type: object
    description: >
      A dashboard card that places a card (question) on the dashboard grid.
    required:
      - entity_id
      - card_id
      - row
      - col
      - size_x
      - size_y
      - serdes/meta
    properties:
      entity_id:
        type: string
        description: NanoID identifier
        pattern: "^[A-Za-z0-9_-]{21}$"
      card_id:
        type: string
        description: Card FK (entity_id of the referenced card)
      row:
        type: integer
        description: Grid row position
        minimum: 0
      col:
        type: integer
        description: Grid column position
        minimum: 0
      size_x:
        type: integer
        description: Width in grid units
        minimum: 1
      size_y:
        type: integer
        description: Height in grid units
        minimum: 1
      action_id:
        type:
          - string
          - "null"
        description: Action FK (entity_id)
      dashboard_tab_id:
        type:
          - string
          - integer
          - "null"
        description: Tab FK
      inline_parameters:
        type: array
        description: Inline parameter overrides
      parameter_mappings:
        type: array
        description: Connects dashboard parameters to card columns/variables
        items:
          $ref: "#/$defs/parameter_mapping"
      series:
        type: array
        description: Overlay series — additional cards on the same visualization
        items:
          $ref: "#/$defs/series"
      visualization_settings:
        type: object
        description: Display settings
        additionalProperties: true
      created_at:
        type: string
        description: ISO 8601 timestamp
        format: date-time
      serdes/meta:
        type: array
        description: "Identity path: Dashboard → DashboardCard"
        items:
          type: object
          required:
            - id
            - model
          properties:
            id:
              type: string
            model:
              type: string
              enum:
                - Dashboard
                - DashboardCard

  parameter_mapping:
    type: object
    description: >
      Connects a dashboard parameter to a specific card column or variable.
    required:
      - card_id
      - parameter_id
      - target
    properties:
      card_id:
        type: string
        description: Card FK (entity_id of the mapped card)
      parameter_id:
        type: string
        description: UUID matching a dashboard parameter's id
        format: uuid
      target:
        type: array
        description: >
          Parameter target. For MBQL: [dimension, [field, Field FK, opts]].
          For native dimension: [dimension, [template-tag, tag_name]].
          For native variable: [variable, [template-tag, tag_name]].

  series:
    type: object
    description: >
      Overlays an additional card on the same dashboard card visualization
      (e.g., multiple lines on one chart).
    required:
      - card_id
      - position
    properties:
      card_id:
        type: string
        description: Card FK (entity_id of the series card)
      position:
        type: integer
        description: Display order (starting at 0)
        minimum: 0
