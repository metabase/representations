$schema: https://json-schema.org/draft/2020-12/schema
title: Query
description: >
  A query definition in serialized pMBQL format. Contains a flat list of
  stages (no recursive source-query nesting). Each stage is either an MBQL
  structured stage or a native SQL stage.

type: object
required:
  - "lib/type"
  - database
  - stages
properties:
  "lib/type":
    type: string
    const: mbql/query
  database:
    $ref: "id.yaml#/$defs/database_id"
  stages:
    type: array
    description: >
      Flat list of query stages. The first stage must have a source
      (source-table or source-card for MBQL, native for native).
      Subsequent stages build on the previous stage's output.
    minItems: 1
    items:
      $ref: "#/$defs/stage"

$defs:
  stage:
    description: >
      A query stage — either MBQL structured or native SQL.
      Dispatches on lib/type.
    type: object
    required:
      - "lib/type"
    properties:
      "lib/type":
        type: string
        enum:
          - mbql.stage/mbql
          - mbql.stage/native
    allOf:
      - if:
          properties:
            "lib/type": { const: mbql.stage/mbql }
        then:
          $ref: "#/$defs/mbql_stage"
      - if:
          properties:
            "lib/type": { const: mbql.stage/native }
        then:
          $ref: "#/$defs/native_stage"

  mbql_stage:
    type: object
    description: >
      An MBQL structured query stage. The first stage in a query must have
      either source-table or source-card. Subsequent stages have neither.
    properties:
      "lib/type":
        const: mbql.stage/mbql
      source-table:
        description: >
          Table FK array [database, schema, table] for physical tables.
          Only valid in the first stage. Mutually exclusive with source-card.
        $ref: "id.yaml#/$defs/table_id"
      source-card:
        description: >
          Card entity_id for saved questions/models.
          Only valid in the first stage. Mutually exclusive with source-table.
        $ref: "id.yaml#/$defs/entity_id"
      joins:
        type: array
        description: Join clauses
        items:
          $ref: "#/$defs/join"
      expressions:
        type: object
        description: >
          Named computed columns. Keys are column names, values are MBQL
          expression clauses.
        additionalProperties:
          $ref: "#/$defs/expression"
      filter:
        description: >
          Filter clause. Either a single comparison [op, {}, field, value]
          or a compound filter [and, {}, ...clauses].
        $ref: "#/$defs/expression"
      aggregation:
        type: array
        description: >
          Aggregation clauses. Each clause is [function, {}, ...args].
        items:
          $ref: "#/$defs/expression"
      breakout:
        type: array
        description: Breakout (GROUP BY) clauses
        items:
          $ref: "#/$defs/expression"
      order-by:
        type: array
        description: >
          Order-by clauses. Each is [direction, {}, expression].
        items:
          $ref: "#/$defs/expression"
      limit:
        type:
          - integer
          - "null"
        description: Row limit

  expression:
    description: >
      An MBQL expression clause (recursive). Either a literal value or
      an array [operator, options, ...args] where options is always an
      object (empty {} when no options apply, never null).
    oneOf:
      - type: string
      - type: number
      - type: boolean
      - type: "null"
      - type: array
        minItems: 1
        allOf:
          # --- References ---
          - if: { prefixItems: [{ const: field }] }
            then:
              $ref: "ref.yaml#/$defs/field_ref"
          - if: { prefixItems: [{ const: expression }] }
            then:
              $ref: "ref.yaml#/$defs/expression_ref"
          - if: { prefixItems: [{ const: aggregation }] }
            then:
              $ref: "ref.yaml#/$defs/aggregation_ref"
          - if: { prefixItems: [{ const: metric }] }
            then:
              $ref: "ref.yaml#/$defs/metric_ref"
          - if: { prefixItems: [{ const: measure }] }
            then:
              $ref: "ref.yaml#/$defs/measure_ref"
          - if: { prefixItems: [{ const: segment }] }
            then:
              $ref: "ref.yaml#/$defs/segment_ref"
          # --- Value literal ---
          - if: { prefixItems: [{ const: value }] }
            then:
              prefixItems:
                - const: value
                - type: object
                - {}
              minItems: 3
              maxItems: 3
          # --- Arithmetic ---
          - if: { prefixItems: [{ enum: ["+", "-", "*", "/"] }] }
            then:
              prefixItems:
                - enum: ["+", "-", "*", "/"]
                - type: object
                - $ref: "#/$defs/expression"
              items: { $ref: "#/$defs/expression" }
              minItems: 3
          # --- Logical ---
          - if: { prefixItems: [{ enum: [and, or] }] }
            then:
              prefixItems:
                - enum: [and, or]
                - type: object
                - $ref: "#/$defs/expression"
                - $ref: "#/$defs/expression"
              items: { $ref: "#/$defs/expression" }
              minItems: 4
          - if: { prefixItems: [{ const: not }] }
            then:
              prefixItems:
                - const: not
                - type: object
                - $ref: "#/$defs/expression"
              minItems: 3
              maxItems: 3
          # --- Comparison ---
          - if: { prefixItems: [{ enum: ["=", "!=", "<", ">", "<=", ">="] }] }
            then:
              prefixItems:
                - enum: ["=", "!=", "<", ">", "<=", ">="]
                - type: object
                - $ref: "#/$defs/expression"
                - $ref: "#/$defs/expression"
              items: { $ref: "#/$defs/expression" }
              minItems: 4
          - if: { prefixItems: [{ enum: [in, not-in] }] }
            then:
              prefixItems:
                - enum: [in, not-in]
                - type: object
                - $ref: "#/$defs/expression"
                - $ref: "#/$defs/expression"
              items: { $ref: "#/$defs/expression" }
              minItems: 4
          - if: { prefixItems: [{ const: between }] }
            then:
              prefixItems:
                - const: between
                - type: object
                - $ref: "#/$defs/expression"
                - $ref: "#/$defs/expression"
                - $ref: "#/$defs/expression"
              minItems: 5
              maxItems: 5
          - if: { prefixItems: [{ const: inside }] }
            then:
              prefixItems:
                - const: inside
                - type: object
                - $ref: "#/$defs/expression"
                - $ref: "#/$defs/expression"
                - { type: number }
                - { type: number }
                - { type: number }
                - { type: number }
              minItems: 8
              maxItems: 8
          # --- Null/empty ---
          - if: { prefixItems: [{ enum: [is-null, not-null, is-empty, not-empty] }] }
            then:
              prefixItems:
                - enum: [is-null, not-null, is-empty, not-empty]
                - type: object
                - $ref: "#/$defs/expression"
              minItems: 3
              maxItems: 3
          # --- String filters ---
          # Options always in position 2 (second argument).
          # 2 value args: [op, {options}, field, value]
          # 3+ value args: [op, {options}, field, value, value, ...]
          - if: { prefixItems: [{ enum: [contains, does-not-contain, starts-with, ends-with] }] }
            then:
              prefixItems:
                - enum: [contains, does-not-contain, starts-with, ends-with]
                - $ref: "#/$defs/case_sensitive_options"
                - $ref: "#/$defs/expression"
                - $ref: "#/$defs/expression"
              items: { $ref: "#/$defs/expression" }
              minItems: 4
          # --- Temporal filters ---
          - if: { prefixItems: [{ const: time-interval }] }
            then:
              prefixItems:
                - const: time-interval
                - type: object
                - $ref: "#/$defs/expression"
                - if: { type: integer }
                  then: { type: integer }
                  else: { enum: [current, last, next] }
                - $ref: "temporal_bucketing.yaml#/$defs/datetime_truncation_unit"
              minItems: 5
              maxItems: 5
          - if: { prefixItems: [{ const: relative-time-interval }] }
            then:
              prefixItems:
                - const: relative-time-interval
                - type: object
                - $ref: "#/$defs/expression"
                - { type: integer }
                - $ref: "temporal_bucketing.yaml#/$defs/datetime_truncation_unit"
                - { type: integer }
                - $ref: "temporal_bucketing.yaml#/$defs/datetime_truncation_unit"
              minItems: 7
              maxItems: 7
          # --- Nullary ---
          - if: { prefixItems: [{ enum: [now, today] }] }
            then:
              prefixItems:
                - enum: [now, today]
                - type: object
              minItems: 2
              maxItems: 2
          # --- Interval ---
          - if: { prefixItems: [{ const: interval }] }
            then:
              prefixItems:
                - const: interval
                - type: object
                - { type: integer }
                - $ref: "temporal_bucketing.yaml#/$defs/datetime_truncation_unit"
              minItems: 4
              maxItems: 4
          # --- Unary functions ---
          - if:
              prefixItems:
                - enum: [abs, ceil, floor, round, sqrt, exp, log, length, trim, ltrim, rtrim, upper, lower, host, domain, subdomain, path, get-year, get-quarter, get-month, get-day, get-hour, get-minute, get-second, text, integer, float, day-name, month-name, quarter-name, date]
            then:
              prefixItems:
                - enum: [abs, ceil, floor, round, sqrt, exp, log, length, trim, ltrim, rtrim, upper, lower, host, domain, subdomain, path, get-year, get-quarter, get-month, get-day, get-hour, get-minute, get-second, text, integer, float, day-name, month-name, quarter-name, date]
                - type: object
                - $ref: "#/$defs/expression"
              minItems: 3
              maxItems: 3
          - if: { prefixItems: [{ const: datetime }] }
            then:
              prefixItems:
                - const: datetime
                - type: object
                  properties:
                    mode:
                      type: string
                      enum: [iso, simple, unix-seconds, unix-milliseconds, unix-microseconds, unix-nanoseconds, iso-bytes, simple-bytes]
                - $ref: "#/$defs/expression"
              minItems: 3
              maxItems: 3
          # --- Week mode functions ---
          - if: { prefixItems: [{ enum: [get-day-of-week, get-week] }] }
            then:
              prefixItems:
                - enum: [get-day-of-week, get-week]
                - type: object
                - $ref: "#/$defs/expression"
                - { type: string, enum: [iso, us, instance] }
              minItems: 3
              maxItems: 4
          # --- Binary/ternary ---
          - if: { prefixItems: [{ const: power }] }
            then:
              prefixItems:
                - const: power
                - type: object
                - $ref: "#/$defs/expression"
                - $ref: "#/$defs/expression"
              minItems: 4
              maxItems: 4
          - if: { prefixItems: [{ enum: [replace, split-part] }] }
            then:
              prefixItems:
                - enum: [replace, split-part]
                - type: object
                - $ref: "#/$defs/expression"
                - $ref: "#/$defs/expression"
                - $ref: "#/$defs/expression"
              minItems: 5
              maxItems: 5
          - if: { prefixItems: [{ const: substring }] }
            then:
              prefixItems:
                - const: substring
                - type: object
                - $ref: "#/$defs/expression"
                - $ref: "#/$defs/expression"
                - $ref: "#/$defs/expression"
              minItems: 4
              maxItems: 5
          - if: { prefixItems: [{ const: collate }] }
            then:
              prefixItems:
                - const: collate
                - type: object
                - $ref: "#/$defs/expression"
                - { type: string }
              minItems: 4
              maxItems: 4
          - if: { prefixItems: [{ const: regex-match-first }] }
            then:
              prefixItems:
                - const: regex-match-first
                - type: object
                - $ref: "#/$defs/expression"
                - { type: string }
              minItems: 4
              maxItems: 4
          # --- Variadic ---
          - if: { prefixItems: [{ const: concat }] }
            then:
              prefixItems:
                - const: concat
                - type: object
                - $ref: "#/$defs/expression"
                - $ref: "#/$defs/expression"
              items: { $ref: "#/$defs/expression" }
              minItems: 4
          - if: { prefixItems: [{ const: coalesce }] }
            then:
              prefixItems:
                - const: coalesce
                - type: object
                - $ref: "#/$defs/expression"
                - $ref: "#/$defs/expression"
              items: { $ref: "#/$defs/expression" }
              minItems: 4
          # --- Datetime ---
          - if: { prefixItems: [{ enum: [datetime-add, datetime-subtract] }] }
            then:
              prefixItems:
                - enum: [datetime-add, datetime-subtract]
                - type: object
                - $ref: "#/$defs/expression"
                - { type: integer }
                - $ref: "temporal_bucketing.yaml#/$defs/datetime_truncation_unit"
              minItems: 5
              maxItems: 5
          - if: { prefixItems: [{ const: datetime-diff }] }
            then:
              prefixItems:
                - const: datetime-diff
                - type: object
                - $ref: "#/$defs/expression"
                - $ref: "#/$defs/expression"
                - $ref: "#/$defs/datetime_diff_unit"
              minItems: 5
              maxItems: 5
          - if: { prefixItems: [{ const: convert-timezone }] }
            then:
              prefixItems:
                - const: convert-timezone
                - type: object
                - $ref: "#/$defs/expression"
                - { type: string }
                - { type: string }
              minItems: 4
              maxItems: 5
          - if: { prefixItems: [{ const: temporal-extract }] }
            then:
              prefixItems:
                - const: temporal-extract
                - type: object
                - $ref: "#/$defs/expression"
                - $ref: "temporal_bucketing.yaml#/$defs/datetime_extraction_unit"
                - { type: string, enum: [iso, us, instance] }
              minItems: 4
              maxItems: 5
          # --- Aggregations ---
          - if: { prefixItems: [{ enum: [count, cum-count] }] }
            then:
              prefixItems:
                - enum: [count, cum-count]
                - type: object
              items: { $ref: "#/$defs/expression" }
              minItems: 2
              maxItems: 3
          - if: { prefixItems: [{ enum: [sum, avg, min, max, distinct, stddev, var, median, cum-sum] }] }
            then:
              prefixItems:
                - enum: [sum, avg, min, max, distinct, stddev, var, median, cum-sum]
                - type: object
                - $ref: "#/$defs/expression"
              minItems: 3
              maxItems: 3
          - if: { prefixItems: [{ const: percentile }] }
            then:
              prefixItems:
                - const: percentile
                - type: object
                - $ref: "#/$defs/expression"
                - { type: number }
              minItems: 4
              maxItems: 4
          - if: { prefixItems: [{ enum: [count-where, share] }] }
            then:
              prefixItems:
                - enum: [count-where, share]
                - type: object
                - $ref: "#/$defs/expression"
              minItems: 3
              maxItems: 3
          - if: { prefixItems: [{ enum: [sum-where, distinct-where] }] }
            then:
              prefixItems:
                - enum: [sum-where, distinct-where]
                - type: object
                - $ref: "#/$defs/expression"
                - $ref: "#/$defs/expression"
              minItems: 4
              maxItems: 4
          - if: { prefixItems: [{ const: aggregation-options }] }
            then:
              prefixItems:
                - const: aggregation-options
                - type: object
                  properties:
                    display-name: { type: string }
                    name: { type: string }
                - $ref: "#/$defs/expression"
              minItems: 3
              maxItems: 3
          # --- Case/if ---
          - if: { prefixItems: [{ enum: [case, if] }] }
            then:
              prefixItems:
                - enum: [case, if]
                - type: object
                  properties:
                    default: { $ref: "#/$defs/expression" }
                - type: array
                  items:
                    type: array
                    prefixItems: [{ $ref: "#/$defs/expression" }, { $ref: "#/$defs/expression" }]
                    minItems: 2
                    maxItems: 2
              minItems: 3
              maxItems: 3
          # --- Offset ---
          - if: { prefixItems: [{ const: offset }] }
            then:
              prefixItems:
                - const: offset
                - type: object
                - $ref: "#/$defs/expression"
                - type: integer
              minItems: 4
              maxItems: 4
          # --- Order-by direction ---
          - if: { prefixItems: [{ enum: [asc, desc] }] }
            then:
              prefixItems:
                - enum: [asc, desc]
                - type: object
                - $ref: "#/$defs/expression"
              minItems: 3
              maxItems: 3

  case_sensitive_options:
    type: object
    properties:
      case-sensitive: { type: boolean }

  datetime_diff_unit:
    description: Units for datetime-diff (no millisecond).
    type: string
    enum: [second, minute, hour, day, week, month, quarter, year]

  join:
    type: object
    description: >
      A join clause. In pMBQL, joins have their own stages array
      instead of source-table/source-query.
    required:
      - stages
      - conditions
      - alias
    properties:
      stages:
        type: array
        description: >
          Query stages for the joined data source. The first stage
          must have source-table or source-card.
        minItems: 1
        items:
          $ref: "#/$defs/stage"
      conditions:
        type: array
        description: Join conditions as MBQL expression clauses
        minItems: 1
        items:
          $ref: "#/$defs/expression"
      alias:
        type: string
        description: Join alias for referencing joined columns
      strategy:
        type: string
        description: Join strategy
        enum:
          - left-join
          - right-join
          - inner-join
          - full-join
      fields:
        description: >
          Which fields to include from the joined table. "all" for all,
          "none" for none, or an array of field reference clauses.
        if: { type: string }
        then: { enum: [all, none] }
        else:
          type: array
          items:
            $ref: "#/$defs/expression"

  native_stage:
    type: object
    description: A native SQL query stage.
    required:
      - "lib/type"
      - native
    properties:
      "lib/type":
        const: mbql.stage/native
      native:
        type: string
        description: SQL query string, may contain {{tag}} placeholders
      template-tags:
        type: object
        description: >
          Template tag definitions. Keys match {{tag}} placeholders in the
          SQL query string.
        additionalProperties:
          $ref: "#/$defs/template_tag"

  template_tag:
    type: object
    description: A template tag for parameterizing native SQL queries.
    required:
      - type
      - name
      - id
    properties:
      type:
        type: string
        description: Tag type
        enum:
          - text
          - number
          - date
          - boolean
          - dimension
          - temporal-unit
          - card
          - snippet
          - table
      name:
        type: string
        description: Tag name (matches the {{name}} placeholder)
      id:
        type: string
        description: UUID identifier
        format: uuid
      display-name:
        type: string
        description: Human-readable label
      default:
        description: Default value (type depends on tag type)
      required:
        type: boolean
        description: Whether a value is required
    allOf:
      - if:
          properties:
            type: { const: dimension }
        then:
          required: [dimension, widget-type]
          properties:
            dimension:
              description: Field reference
              $ref: "#/$defs/expression"
            widget-type:
              type: string
              description: Filter widget type (e.g., string/=, date/range)
            options:
              type: object
              description: Options for generated filter clause (e.g., case-sensitive)
            alias:
              type: string
              description: SQL column identifier used inside the generated expression (e.g., the column in DATE_TRUNC(unit, column))
      - if:
          properties:
            type: { const: temporal-unit }
        then:
          required: [dimension]
          properties:
            dimension:
              description: Field reference — the temporal column to group
              $ref: "#/$defs/expression"
            alias:
              type: string
              description: SQL column identifier used inside the generated expression (e.g., the column in DATE_TRUNC(unit, column))
      - if:
          properties:
            type: { const: card }
        then:
          required: [card-id]
          properties:
            card-id:
              description: Card entity_id of the referenced card
              $ref: "id.yaml#/$defs/entity_id"
      - if:
          properties:
            type: { const: snippet }
        then:
          required: [snippet-name, snippet-id]
          properties:
            snippet-name:
              type: string
              description: Snippet name
            snippet-id:
              description: Snippet entity_id
              $ref: "id.yaml#/$defs/entity_id"
      - if:
          properties:
            type: { const: table }
        then:
          required: [table-id]
          properties:
            table-id:
              description: Table FK
              $ref: "id.yaml#/$defs/table_id"
            emit-alias:
              type: boolean
              description: Whether to emit the table name as an alias
