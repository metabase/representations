$schema: https://json-schema.org/draft/2020-12/schema
title: Ref
description: >
  Column and entity reference types used in MBQL expressions,
  parameter mappings, and visualization settings.

$defs:
  base_type_options:
    description: Options with only base-type hint.
    type: object
    properties:
      base-type:
        type: string
        description: Base type hint (e.g., type/Float, type/Integer)

  field_options:
    description: Full field options (only valid on field refs).
    type: object
    properties:
      base-type:
        type: string
        description: Base type hint (e.g., type/Float, type/Integer)
      temporal-unit:
        $ref: "temporal_bucketing.yaml#/$defs/datetime_bucketing_unit"
      join-alias:
        type: string
        description: Alias of the join this field belongs to
      binning:
        type: object
        description: >
          Binning strategy: {strategy: num-bins, num-bins: N},
          {strategy: bin-width, bin-width: N}, or {strategy: default}.
        required:
          - strategy
        properties:
          strategy:
            type: string
            enum: [default, num-bins, bin-width]
        allOf:
          - if:
              properties:
                strategy: { const: bin-width }
            then:
              required: [bin-width]
              properties:
                bin-width:
                  type: number
                  exclusiveMinimum: 0
          - if:
              properties:
                strategy: { const: num-bins }
            then:
              required: [num-bins]
              properties:
                num-bins:
                  type: integer
                  minimum: 1
      source-field:
        description: FK field reference for implicit joins
        $ref: "id.yaml#/$defs/field_id"
      source-field-name:
        type: string
        description: FK field name for implicit joins in nested queries
      source-field-join-alias:
        type: string
        description: Join alias when FK table is explicitly joined

  field_ref:
    description: >
      Field reference: [field, Field-FK-or-name, options-or-null].
      Field FK is [database, schema, table, field, ...] (4+ elements for JSON paths).
      For nested queries, the second element is a column name string.
    type: array
    prefixItems:
      - const: field
      - description: Field FK (array) or column name (string, for nested queries)
        if: { type: array }
        then: { $ref: "id.yaml#/$defs/field_id" }
      - type: [object, "null"]
        if: { type: object }
        then: { $ref: "#/$defs/field_options" }
    minItems: 3
    maxItems: 3

  expression_ref:
    description: >
      Expression reference: [expression, name] or [expression, name, options].
    type: array
    prefixItems:
      - const: expression
      - type: string
        description: Expression name
      - type: [object, "null"]
        if: { type: object }
        then: { $ref: "#/$defs/base_type_options" }
    minItems: 2
    maxItems: 3

  aggregation_ref:
    description: >
      Aggregation reference: [aggregation, index] or [aggregation, index, options].
    type: array
    prefixItems:
      - const: aggregation
      - type: integer
        description: Aggregation index (0-based)
      - type: [object, "null"]
        if: { type: object }
        then: { $ref: "#/$defs/base_type_options" }
    minItems: 2
    maxItems: 3

  metric_ref:
    description: >
      Metric reference: [metric, entity_id] or [metric, entity_id, options-or-null].
    type: array
    prefixItems:
      - const: metric
      - type: string
        description: Metric card entity_id
      - type: [object, "null"]
        if: { type: object }
        then: { $ref: "#/$defs/base_type_options" }
    minItems: 2
    maxItems: 3

  measure_ref:
    description: >
      Measure reference: [measure, entity_id] or [measure, entity_id, options-or-null].
    type: array
    prefixItems:
      - const: measure
      - type: string
        description: Measure entity_id
      - type: [object, "null"]
        if: { type: object }
        then: { $ref: "#/$defs/base_type_options" }
    minItems: 2
    maxItems: 3

  segment_ref:
    description: >
      Segment reference: [segment, entity_id] or [segment, entity_id, options-or-null].
    type: array
    prefixItems:
      - const: segment
      - type: string
        description: Segment entity_id
      - type: [object, "null"]
        if: { type: object }
        then: { $ref: "#/$defs/base_type_options" }
    minItems: 2
    maxItems: 3
