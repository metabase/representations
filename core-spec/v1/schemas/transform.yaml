$schema: https://json-schema.org/draft/2020-12/schema
title: Transform
description: >
  Generates a table in the database by running a query or Python script.
  Transforms allow materializing results as persistent database tables.
type: object
required:
  - name
  - entity_id
  - source
  - target
  - serdes/meta
properties:
  name:
    type: string
    description: Transform name
  entity_id:
    type: string
    description: NanoID identifier (21 characters, alphabet A-Za-z0-9_-)
    pattern: "^[A-Za-z0-9_-]{21}$"
  creator_id:
    type: string
    description: User FK (email address)
    format: email
  description:
    type:
      - string
      - "null"
    description: Human-readable description
  collection_id:
    type:
      - string
      - "null"
    description: Collection FK (entity_id), null for root collection
  source_database_id:
    type:
      - string
      - "null"
    description: Database FK (database name)
  source:
    description: >
      Source definition — either a query (type: query) or a Python script
      (type: python).
    oneOf:
      - $ref: "#/$defs/query_source"
      - $ref: "#/$defs/python_source"
  target:
    type: object
    description: Where the resulting table is written
    required:
      - type
      - name
    properties:
      database:
        type: string
        description: Database FK (database name)
      type:
        type: string
        const: table
      schema:
        type:
          - string
          - "null"
        description: Target schema name
      name:
        type: string
        description: Target table name
  tags:
    type: array
    description: Transform tag associations
    items:
      type: object
      properties:
        entity_id:
          type: string
          description: NanoID of this tag association
        tag_id:
          type: string
          description: TransformTag entity_id
        position:
          type: integer
          description: Ordering position
        serdes/meta:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              model:
                type: string
                const: TransformTransformTag
  created_at:
    type: string
    description: ISO 8601 timestamp
    format: date-time
  serdes/meta:
    type: array
    description: Identity path for serialization
    items:
      type: object
      required:
        - id
        - model
      properties:
        id:
          type: string
          description: Entity identifier (matches entity_id)
        label:
          type: string
          description: Slugified name
        model:
          type: string
          const: Transform

$defs:
  query_source:
    type: object
    description: Query-based source (MBQL or native)
    required:
      - type
      - query
    properties:
      type:
        type: string
        const: query
      query:
        type: object
        description: Dataset query (MBQL or native)
        required:
          - database
          - type
        properties:
          database:
            type: string
            description: Database FK (database name)
          type:
            type: string
            enum:
              - query
              - native
          query:
            type: object
            description: MBQL query
            properties:
              source-table:
                description: >
                  Data source. Either a Table FK array [database, schema, table]
                  for physical tables, or a Card entity_id string for saved
                  questions/models.
                oneOf:
                  - type: array
                    items:
                      type:
                        - string
                        - "null"
                    minItems: 3
                    maxItems: 3
                  - type: string
                    pattern: "^[A-Za-z0-9_-]{21}$"
              source-query:
                type: object
                description: Nested MBQL query used as the data source
              joins:
                type: array
              expressions:
                type: object
                additionalProperties: true
              filter: {}
              aggregation:
                type: array
              breakout:
                type: array
              order-by:
                type: array
              limit:
                type:
                  - integer
                  - "null"
          native:
            type: object
            description: Native SQL query
            properties:
              query:
                type: string
              template-tags:
                type: object
      source-incremental-strategy:
        type: object
        description: Incremental execution strategy

  python_source:
    type: object
    description: >
      Python script source. The script receives source tables as pandas
      DataFrames and must return a DataFrame as the result.
    required:
      - type
      - body
      - source-tables
    properties:
      type:
        type: string
        const: python
      body:
        type: string
        description: Python source code
      source-tables:
        type: array
        description: Source tables available to the script as DataFrames
        items:
          type: object
          required:
            - alias
            - database_id
          properties:
            alias:
              type: string
              description: Variable name for the table in Python
            database_id:
              type: integer
              description: Database ID
            schema:
              type:
                - string
                - "null"
              description: Schema name
            table:
              type: string
              description: Table name
            table_id:
              type:
                - integer
                - "null"
              description: Metabase table ID
      source-database:
        type: integer
        description: Source database ID
      source-incremental-strategy:
        type: object
        description: Incremental execution strategy
