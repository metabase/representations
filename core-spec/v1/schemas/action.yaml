$schema: https://json-schema.org/draft/2020-12/schema
title: Action
description: >
  An action that writes to a database. A query action runs parameterized SQL and
  lives in a collection like a card. An implicit action creates, updates, or
  deletes one row of a table: the table its `implicit` entry names, or, for an
  action of a model, the model card's table. Attaching any action to a model is
  deprecated. Exactly one of `implicit` and `query` holds the action's
  definition, the one its `type` names.
type: object
required:
  - name
  - entity_id
  - type
  - serdes/meta
properties:
  name:
    type: string
    description: Action name
  entity_id:
    $ref: "common/id.yaml#/$defs/entity_id"
  type:
    type: string
    description: Which of `implicit` or `query` defines the action
    enum:
      - implicit
      - query
  collection_id:
    description: >
      Collection FK (entity_id); null for the root collection. An action with a
      model is always in its model's collection.
    type: [string, "null"]
    if: { type: string }
    then: { $ref: "common/id.yaml#/$defs/entity_id" }
  model_id:
    description: >
      Deprecated. Card FK (entity_id) of the model the action is attached to,
      kept only for actions made before actions had their own collection. Omit
      it, or leave it null; an implicit action without one names its table.
    deprecated: true
    type: [string, "null"]
    if: { type: string }
    then: { $ref: "common/id.yaml#/$defs/entity_id" }
  creator_id:
    description: User FK (email)
    type: [string, "null"]
    if: { type: string }
    then: { $ref: "common/id.yaml#/$defs/user_id" }
  description:
    type: [string, "null"]
    description: Human-readable description
  archived:
    type: boolean
    description: Whether archived
    default: false
  archived_directly:
    type: boolean
    description: Whether the action itself was archived, rather than archived with its collection or model
    default: false
  implicit:
    type: array
    description: The implicit action's definition, when `type` is `implicit`; otherwise empty
    maxItems: 1
    items:
      type: object
      required:
        - kind
      properties:
        kind:
          type: string
          description: What the action does to a row of its table
          enum:
            - row/create
            - row/update
            - row/delete
            - bulk/create
            - bulk/update
            - bulk/delete
        table_id:
          description: >
            The table the action writes to, required without a `model_id` and
            omitted or null with one. It needs exactly one primary key, and must
            be published to the Library for an action in a data app's
            collection. A table missing on import is created as a stub.
          oneOf:
            - $ref: "common/id.yaml#/$defs/table_id"
            - type: "null"
  query:
    type: array
    description: The query action's definition, when `type` is `query`; otherwise empty
    maxItems: 1
    items:
      type: object
      required:
        - dataset_query
      properties:
        database_id:
          description: >
            The database of `dataset_query`, which Metabase derives from the
            query on import; omit it when authoring.
          $ref: "common/id.yaml#/$defs/database_id"
        dataset_query:
          description: The native query the action runs, with its template tags
          $ref: "common/query.yaml"
  parameters:
    type: array
    description: >
      The action's inputs. A query action maps each one to a template tag of
      its query; an implicit action's are computed from its table's fields
      (without sensitive and retired ones) or its model's, and stored empty.
    items:
      type: object
      required:
        - id
        - type
      properties:
        id:
          type: string
          minLength: 1
          description: Parameter identifier
        name:
          type: string
          description: Display name
        slug:
          type: string
          description: URL-friendly identifier
        type:
          type: string
          description: Parameter type (see Parameter Types)
        required:
          type: boolean
          description: Whether a value is required
        target:
          $ref: "common/parameter.yaml#/$defs/parameter_target"
      additionalProperties: true
  parameter_mappings:
    type: [array, "null"]
    description: Parameter mappings (unused, usually empty)
    items: {}
  visualization_settings:
    type: [object, "null"]
    description: >
      The action's form. `fields` maps a parameter id to its settings: `hidden`
      and `defaultValue` change what executing the action accepts, the rest
      only how Metabase's form shows the field.
    properties:
      fields:
        type: object
        additionalProperties:
          type: object
          properties:
            id:
              type: string
              description: The parameter id these settings apply to
            hidden:
              type: boolean
              description: Hidden from the form; executing the action rejects a value for it
            defaultValue:
              description: Value used when executing the action without one
            title:
              type: string
            description:
              type: [string, "null"]
            placeholder:
              type: string
            order:
              type: integer
            required:
              type: boolean
            inputType:
              type: string
            fieldType:
              type: string
          additionalProperties: true
    additionalProperties: true
  public_uuid:
    type: [string, "null"]
    description: Public sharing UUID
    format: uuid
  made_public_by_id:
    description: User who made this public
    type: [string, "null"]
    if: { type: string }
    then: { $ref: "common/id.yaml#/$defs/user_id" }
  created_at:
    type: string
    description: ISO 8601 timestamp
    format: date-time
  serdes/meta:
    type: array
    description: Identity path for serialization
    items:
      type: object
      required:
        - model
      properties:
        id:
          type: string
          description: Entity identifier (matches entity_id)
        label:
          type: string
          description: Slugified name
        model:
          type: string
          const: Action
allOf:
  - if: { properties: { type: { const: implicit } }, required: [type] }
    then:
      required: [implicit]
      properties: { implicit: { type: array, minItems: 1 } }
      anyOf:
        - { required: [model_id], properties: { model_id: { type: string } } }
        - properties:
            implicit: { type: array, items: { type: object, required: [table_id], properties: { table_id: { type: array } } } }
  - if: { properties: { type: { const: query } }, required: [type] }
    then: { required: [query], properties: { query: { type: array, minItems: 1 } } }
additionalProperties: true
