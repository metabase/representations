$schema: https://json-schema.org/draft/2020-12/schema
title: Query
description: >
  A query definition in Metabase. Wraps either an MBQL structured query
  or a native SQL query. The inner MBQL query supports recursive nesting
  via source-query and recursive expression clauses.

type: object
required:
  - database
  - type
properties:
  database:
    $ref: "common.yaml#/$defs/database_id"
  type:
    type: string
    description: Query language type
    enum:
      - query
      - native
  query:
    description: MBQL structured query (when type is "query")
    $ref: "#/$defs/mbql_query"
  native:
    description: Native SQL query (when type is "native")
    $ref: "#/$defs/native_query"

$defs:
  mbql_query:
    type: object
    description: >
      An MBQL structured query. Supports recursive nesting via source-query
      and recursive expression clauses for filter, aggregation, breakout,
      expressions, and order-by.
    properties:
      source-table:
        description: >
          Data source. Either a Table FK array [database, schema, table]
          for physical tables, or a Card entity_id string for saved
          questions/models.
        oneOf:
          - description: Table FK [database, schema, table]
            $ref: "common.yaml#/$defs/table_id"
          - description: Card entity_id (NanoID) referencing a saved card/model
            $ref: "common.yaml#/$defs/entity_id"
      source-query:
        description: >
          Nested MBQL query used as the data source instead of a table.
          Fields from the inner query are referenced by column name (string)
          rather than a Field FK. Can be nested to arbitrary depth.
        $ref: "#/$defs/mbql_query"
      joins:
        type: array
        description: Join clauses
        items:
          $ref: "#/$defs/join"
      expressions:
        type: object
        description: >
          Named computed columns. Keys are column names, values are MBQL
          expression clauses.
        additionalProperties:
          $ref: "#/$defs/expression"
      filter:
        description: >
          Filter clause. Either a single comparison [op, field, value] or
          a compound filter [and/or, ...clauses].
        $ref: "#/$defs/expression"
      aggregation:
        type: array
        description: >
          Aggregation clauses. Each clause is [function, ...args] where
          function is count, sum, avg, min, max, distinct, cum-count,
          cum-sum, stddev, var, median, percentile, count-where, sum-where,
          share, or metric. A metric clause references a saved metric card:
          [metric, entity_id]. A measure clause: [measure, entity_id].
        items:
          $ref: "#/$defs/expression"
      breakout:
        type: array
        description: Breakout (GROUP BY) clauses
        items:
          $ref: "#/$defs/expression"
      order-by:
        type: array
        description: >
          Order-by clauses. Each is [direction, expression] where direction
          is "asc" or "desc".
        items:
          $ref: "#/$defs/expression"
      limit:
        type:
          - integer
          - "null"
        description: Row limit

  expression:
    description: >
      An MBQL expression clause (recursive). Either a literal value or
      an array [operator, ...args]. Uses if/then dispatch on the first
      element for fast, strict per-operator validation.
    oneOf:
      - type: string
      - type: number
      - type: boolean
      - type: "null"
      - type: array
        minItems: 1
        allOf:
          # --- References ---
          - if: { prefixItems: [{ const: field }] }
            then:
              $ref: "ref.yaml#/$defs/field_ref"
          - if: { prefixItems: [{ const: expression }] }
            then:
              $ref: "ref.yaml#/$defs/expression_ref"
          - if: { prefixItems: [{ const: aggregation }] }
            then:
              $ref: "ref.yaml#/$defs/aggregation_ref"
          - if: { prefixItems: [{ const: metric }] }
            then:
              $ref: "ref.yaml#/$defs/metric_ref"
          - if: { prefixItems: [{ const: measure }] }
            then:
              $ref: "ref.yaml#/$defs/measure_ref"
          - if: { prefixItems: [{ const: segment }] }
            then:
              $ref: "ref.yaml#/$defs/segment_ref"
          # --- Value literal ---
          - if: { prefixItems: [{ const: value }] }
            then: { minItems: 2 }
          # --- Arithmetic ---
          - if: { prefixItems: [{ enum: ["+", "-", "*", "/"] }] }
            then:
              prefixItems:
                - enum: ["+", "-", "*", "/"]
                - $ref: "#/$defs/expression"
              items: { $ref: "#/$defs/expression" }
              minItems: 2
          # --- Logical ---
          - if: { prefixItems: [{ enum: [and, or] }] }
            then:
              prefixItems:
                - enum: [and, or]
                - $ref: "#/$defs/expression"
                - $ref: "#/$defs/expression"
              items: { $ref: "#/$defs/expression" }
              minItems: 3
          - if: { prefixItems: [{ const: not }] }
            then:
              prefixItems: [{ const: not }, { $ref: "#/$defs/expression" }]
              minItems: 2
              maxItems: 2
          # --- Comparison ---
          - if: { prefixItems: [{ enum: ["=", "!=", "<", ">", "<=", ">="] }] }
            then:
              prefixItems:
                - enum: ["=", "!=", "<", ">", "<=", ">="]
                - $ref: "#/$defs/expression"
                - $ref: "#/$defs/expression"
              items: { $ref: "#/$defs/expression" }
              minItems: 3
          - if: { prefixItems: [{ const: between }] }
            then:
              prefixItems:
                - const: between
                - $ref: "#/$defs/expression"
                - $ref: "#/$defs/expression"
                - $ref: "#/$defs/expression"
              minItems: 4
              maxItems: 4
          - if: { prefixItems: [{ const: inside }] }
            then:
              prefixItems:
                - const: inside
                - $ref: "#/$defs/expression"
                - $ref: "#/$defs/expression"
                - { type: number }
                - { type: number }
                - { type: number }
                - { type: number }
              minItems: 7
              maxItems: 7
          # --- Null/empty ---
          - if: { prefixItems: [{ enum: [is-null, not-null, is-empty, not-empty] }] }
            then:
              prefixItems:
                - enum: [is-null, not-null, is-empty, not-empty]
                - $ref: "#/$defs/expression"
              minItems: 2
              maxItems: 2
          # --- String filters ---
          - if: { prefixItems: [{ enum: [contains, does-not-contain, starts-with, ends-with] }] }
            then:
              prefixItems:
                - enum: [contains, does-not-contain, starts-with, ends-with]
              minItems: 3
          # --- Temporal filters ---
          - if: { prefixItems: [{ const: time-interval }] }
            then:
              prefixItems:
                - const: time-interval
                - $ref: "#/$defs/expression"
                - { anyOf: [{ type: integer }, { enum: [current, last, next] }] }
                - $ref: "common.yaml#/$defs/datetime_truncation_unit"
              minItems: 4
              maxItems: 5
          - if: { prefixItems: [{ const: relative-time-interval }] }
            then:
              prefixItems:
                - const: relative-time-interval
                - $ref: "#/$defs/expression"
                - { type: integer }
                - $ref: "common.yaml#/$defs/datetime_truncation_unit"
                - { type: integer }
                - $ref: "common.yaml#/$defs/datetime_truncation_unit"
              minItems: 6
              maxItems: 6
          - if: { prefixItems: [{ const: absolute-datetime }] }
            then:
              prefixItems:
                - const: absolute-datetime
                - { type: string }
                - $ref: "common.yaml#/$defs/datetime_bucketing_unit"
              minItems: 3
              maxItems: 3
          - if: { prefixItems: [{ const: relative-datetime }] }
            then:
              prefixItems:
                - const: relative-datetime
                - { anyOf: [{ type: integer }, { const: current }] }
              items: { $ref: "common.yaml#/$defs/datetime_truncation_unit" }
              minItems: 2
              maxItems: 3
          # --- Nullary ---
          - if: { prefixItems: [{ enum: [now, today] }] }
            then: { minItems: 1, maxItems: 1 }
          # --- Interval ---
          - if: { prefixItems: [{ const: interval }] }
            then:
              prefixItems:
                - const: interval
                - { type: integer }
                - $ref: "common.yaml#/$defs/datetime_truncation_unit"
              minItems: 3
              maxItems: 3
          # --- Unary functions ---
          - if:
              prefixItems:
                - enum: [abs, ceil, floor, round, sqrt, exp, log, length, trim, ltrim, rtrim, upper, lower, host, domain, subdomain, path, get-year, get-quarter, get-month, get-day, get-hour, get-minute, get-second, text, integer, float, boolean, day-name, month-name, quarter-name]
            then:
              prefixItems:
                - enum: [abs, ceil, floor, round, sqrt, exp, log, length, trim, ltrim, rtrim, upper, lower, host, domain, subdomain, path, get-year, get-quarter, get-month, get-day, get-hour, get-minute, get-second, text, integer, float, boolean, day-name, month-name, quarter-name]
                - $ref: "#/$defs/expression"
              minItems: 2
              maxItems: 2
          # --- Week mode functions ---
          - if: { prefixItems: [{ enum: [get-day-of-week, get-week] }] }
            then:
              prefixItems:
                - enum: [get-day-of-week, get-week]
                - $ref: "#/$defs/expression"
              items: { type: string, enum: [iso, us, instance] }
              minItems: 2
              maxItems: 3
          # --- Binary/ternary ---
          - if: { prefixItems: [{ const: power }] }
            then:
              prefixItems: [{ const: power }, { $ref: "#/$defs/expression" }, { $ref: "#/$defs/expression" }]
              minItems: 3
              maxItems: 3
          - if: { prefixItems: [{ enum: [substring, replace, split-part] }] }
            then:
              prefixItems:
                - enum: [substring, replace, split-part]
                - $ref: "#/$defs/expression"
                - $ref: "#/$defs/expression"
                - $ref: "#/$defs/expression"
              minItems: 4
              maxItems: 4
          - if: { prefixItems: [{ const: regex-match-first }] }
            then:
              prefixItems: [{ const: regex-match-first }, { $ref: "#/$defs/expression" }, { type: string }]
              minItems: 3
              maxItems: 3
          # --- Variadic ---
          - if: { prefixItems: [{ const: concat }] }
            then:
              prefixItems: [{ const: concat }, { $ref: "#/$defs/expression" }, { $ref: "#/$defs/expression" }]
              items: { $ref: "#/$defs/expression" }
              minItems: 3
          - if: { prefixItems: [{ const: coalesce }] }
            then:
              prefixItems: [{ const: coalesce }, { $ref: "#/$defs/expression" }, { $ref: "#/$defs/expression" }]
              items: { $ref: "#/$defs/expression" }
              minItems: 3
          # --- Datetime ---
          - if: { prefixItems: [{ enum: [datetime-add, datetime-subtract] }] }
            then:
              prefixItems:
                - enum: [datetime-add, datetime-subtract]
                - $ref: "#/$defs/expression"
                - { type: integer }
                - $ref: "common.yaml#/$defs/datetime_truncation_unit"
              minItems: 4
              maxItems: 4
          - if: { prefixItems: [{ const: datetime-diff }] }
            then:
              prefixItems:
                - const: datetime-diff
                - $ref: "#/$defs/expression"
                - $ref: "#/$defs/expression"
                - $ref: "#/$defs/datetime_diff_unit"
              minItems: 4
              maxItems: 4
          - if: { prefixItems: [{ const: convert-timezone }] }
            then:
              prefixItems: [{ const: convert-timezone }, { $ref: "#/$defs/expression" }, { type: string }]
              items: { type: string }
              minItems: 3
              maxItems: 4
          - if: { prefixItems: [{ const: temporal-extract }] }
            then:
              prefixItems:
                - const: temporal-extract
                - $ref: "#/$defs/expression"
                - $ref: "common.yaml#/$defs/datetime_extraction_unit"
              items: { type: string, enum: [iso, us, instance] }
              minItems: 3
              maxItems: 4
          # --- Aggregations ---
          - if: { prefixItems: [{ enum: [count, cum-count, cum-sum] }] }
            then:
              prefixItems: [{ enum: [count, cum-count, cum-sum] }]
              items: { $ref: "#/$defs/expression" }
              minItems: 1
              maxItems: 2
          - if: { prefixItems: [{ enum: [sum, avg, min, max, distinct, stddev, var, median] }] }
            then:
              prefixItems:
                - enum: [sum, avg, min, max, distinct, stddev, var, median]
                - $ref: "#/$defs/expression"
              minItems: 2
              maxItems: 2
          - if: { prefixItems: [{ const: percentile }] }
            then:
              prefixItems: [{ const: percentile }, { $ref: "#/$defs/expression" }, { type: number }]
              minItems: 3
              maxItems: 3
          - if: { prefixItems: [{ enum: [count-where, share] }] }
            then:
              prefixItems: [{ enum: [count-where, share] }, { $ref: "#/$defs/expression" }]
              minItems: 2
              maxItems: 2
          - if: { prefixItems: [{ enum: [sum-where, distinct-where] }] }
            then:
              prefixItems:
                - enum: [sum-where, distinct-where]
                - $ref: "#/$defs/expression"
                - $ref: "#/$defs/expression"
              minItems: 3
              maxItems: 3
          - if: { prefixItems: [{ const: aggregation-options }] }
            then:
              prefixItems:
                - const: aggregation-options
                - $ref: "#/$defs/expression"
                - type: object
                  properties:
                    display-name: { type: string }
                    name: { type: string }
              minItems: 3
              maxItems: 3
          # --- Case/if ---
          - if: { prefixItems: [{ enum: [case, if] }] }
            then:
              prefixItems:
                - enum: [case, if]
                - type: array
                  items:
                    type: array
                    prefixItems: [{ $ref: "#/$defs/expression" }, { $ref: "#/$defs/expression" }]
                    minItems: 2
                    maxItems: 2
              items: { $ref: "#/$defs/expression" }
              minItems: 2
              maxItems: 3
          # --- Offset ---
          - if: { prefixItems: [{ const: offset }] }
            then:
              prefixItems: [{ const: offset }, { $ref: "#/$defs/expression" }, { type: integer }]
              minItems: 3
              maxItems: 3
          # --- Order-by direction ---
          - if: { prefixItems: [{ enum: [asc, desc] }] }
            then:
              prefixItems: [{ enum: [asc, desc] }, { $ref: "#/$defs/expression" }]
              minItems: 2
              maxItems: 2

  datetime_diff_unit:
    description: Units for datetime-diff (no millisecond).
    type: string
    enum: [second, minute, hour, day, week, month, quarter, year]

  join:
    type: object
    description: A join clause combining data from another table or query.
    properties:
      source-table:
        description: Table FK or Card entity_id of the joined data source
        oneOf:
          - description: Table FK [database, schema, table]
            $ref: "common.yaml#/$defs/table_id"
          - description: Card entity_id (NanoID)
            $ref: "common.yaml#/$defs/entity_id"
      condition:
        description: Join condition as MBQL expression clause
        $ref: "#/$defs/expression"
      alias:
        type: string
        description: Join alias for referencing joined columns
      strategy:
        type: string
        description: Join strategy
        enum:
          - left-join
          - right-join
          - inner-join
          - full-join
      fields:
        description: >
          Which fields to include from the joined table. "all" for all,
          "none" for none, or an array of field reference clauses.
        oneOf:
          - type: string
            enum:
              - all
              - none
          - type: array
            items:
              $ref: "#/$defs/expression"

  native_query:
    type: object
    description: A native SQL query with optional template tags for parameterization.
    required:
      - query
    properties:
      query:
        type: string
        description: SQL query string, may contain {{tag}} placeholders
      template-tags:
        type: object
        description: >
          Template tag definitions. Keys match {{tag}} placeholders in the
          SQL query string.
        additionalProperties:
          $ref: "#/$defs/template_tag"

  template_tag:
    type: object
    description: A template tag for parameterizing native SQL queries.
    required:
      - type
      - name
      - id
    properties:
      type:
        type: string
        description: Tag type
        enum:
          - text
          - number
          - date
          - boolean
          - dimension
          - temporal-unit
          - card
          - snippet
          - table
      name:
        type: string
        description: Tag name (matches the {{name}} placeholder)
      id:
        type: string
        description: UUID identifier
        format: uuid
      display-name:
        type: string
        description: Human-readable label
      default:
        description: Default value (type depends on tag type)
      required:
        type: boolean
        description: Whether a value is required
      dimension:
        description: Field reference for dimension type
        $ref: "#/$defs/expression"
      widget-type:
        type: string
        description: Filter widget type (e.g., string/=, date/range)
      options:
        type: object
        description: Options for generated filter clause (e.g., case-sensitive)
      alias:
        type: string
        description: >
          Name used to reference this expression in SQL
          (for temporal-unit and dimension tags)
      card-id:
        description: Card entity_id for card type tags
        $ref: "common.yaml#/$defs/entity_id"
      snippet-name:
        type: string
        description: Snippet name for snippet type tags
      snippet-id:
        description: Snippet entity_id for snippet type tags
        $ref: "common.yaml#/$defs/entity_id"
      table-id:
        description: Table FK for table type tags
        $ref: "common.yaml#/$defs/table_id"
      emit-alias:
        type: boolean
        description: Whether to emit the table name as an alias (for table tags)
