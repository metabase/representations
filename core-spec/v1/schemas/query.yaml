$schema: https://json-schema.org/draft/2020-12/schema
title: Query
description: >
  A query definition in Metabase. Wraps either an MBQL structured query
  or a native SQL query. The inner MBQL query supports recursive nesting
  via source-query and recursive expression clauses.

type: object
required:
  - database
  - type
properties:
  database:
    $ref: "common.yaml#/$defs/database_id"
  type:
    type: string
    description: Query language type
    enum:
      - query
      - native
  query:
    description: MBQL structured query (when type is "query")
    $ref: "#/$defs/mbql_query"
  native:
    description: Native SQL query (when type is "native")
    $ref: "#/$defs/native_query"

$defs:
  mbql_query:
    type: object
    description: >
      An MBQL structured query. Supports recursive nesting via source-query
      and recursive expression clauses for filter, aggregation, breakout,
      expressions, and order-by.
    properties:
      source-table:
        description: >
          Data source. Either a Table FK array [database, schema, table]
          for physical tables, or a Card entity_id string for saved
          questions/models.
        oneOf:
          - description: Table FK [database, schema, table]
            $ref: "common.yaml#/$defs/table_id"
          - description: Card entity_id (NanoID) referencing a saved card/model
            $ref: "common.yaml#/$defs/entity_id"
      source-query:
        description: >
          Nested MBQL query used as the data source instead of a table.
          Fields from the inner query are referenced by column name (string)
          rather than a Field FK. Can be nested to arbitrary depth.
        $ref: "#/$defs/mbql_query"
      joins:
        type: array
        description: Join clauses
        items:
          $ref: "#/$defs/join"
      expressions:
        type: object
        description: >
          Named computed columns. Keys are column names, values are MBQL
          expression clauses.
        additionalProperties:
          $ref: "#/$defs/expression"
      filter:
        description: >
          Filter clause. Either a single comparison [op, field, value] or
          a compound filter [and/or, ...clauses].
        $ref: "#/$defs/expression"
      aggregation:
        type: array
        description: >
          Aggregation clauses. Each clause is [function, ...args] where
          function is count, sum, avg, min, max, distinct, cum-count,
          cum-sum, stddev, var, median, percentile, count-where, sum-where,
          share, or metric. A metric clause references a saved metric card:
          [metric, entity_id]. A measure clause: [measure, entity_id].
        items:
          $ref: "#/$defs/expression"
      breakout:
        type: array
        description: Breakout (GROUP BY) clauses
        items:
          $ref: "#/$defs/expression"
      order-by:
        type: array
        description: >
          Order-by clauses. Each is [direction, expression] where direction
          is "asc" or "desc".
        items:
          $ref: "#/$defs/expression"
      limit:
        type:
          - integer
          - "null"
        description: Row limit

  expression:
    description: An MBQL expression clause (recursive).
    anyOf:
      # Literal values
      - type: string
      - type: number
      - type: boolean
      - type: "null"
      # Field reference: [field, FK-or-name, options-or-null]
      - type: array
        prefixItems:
          - const: field
          - anyOf:
              - description: Field FK
                $ref: "common.yaml#/$defs/field_id"
              - type: string
                description: Column name (for nested queries)
          - anyOf:
              - type: object
                description: Field options
                properties:
                  base-type:
                    type: string
                    description: Base type hint (e.g., type/Float, type/Integer)
                  temporal-unit:
                    $ref: "common.yaml#/$defs/datetime_bucketing_unit"
                  join-alias:
                    type: string
                    description: Alias of the join this field belongs to
                  binning:
                    type: object
                    description: >
                      Binning strategy. Use {strategy: num-bins, num-bins: N}
                      or {strategy: bin-width, bin-width: N} or {strategy: default}.
                    required:
                      - strategy
                    properties:
                      strategy:
                        type: string
                        enum: [default, num-bins, bin-width]
                      num-bins:
                        type: integer
                        description: Number of bins (for num-bins strategy)
                        minimum: 1
                      bin-width:
                        type: number
                        description: Width of each bin (for bin-width strategy)
                        exclusiveMinimum: 0
                  source-field:
                    description: FK field reference for implicit joins
                    $ref: "common.yaml#/$defs/field_id"
                  source-field-name:
                    type: string
                    description: FK field name for implicit joins in nested queries
                  source-field-join-alias:
                    type: string
                    description: Join alias when FK table is explicitly joined
              - type: "null"
        minItems: 3
        maxItems: 3
      # Expression name ref: [expression, name]
      - type: array
        prefixItems:
          - const: expression
          - type: string
        minItems: 2
        maxItems: 2
      # Aggregation index ref: [aggregation, index]
      - type: array
        prefixItems:
          - const: aggregation
          - type: integer
        minItems: 2
        maxItems: 2
      # Entity refs: [metric/measure/segment, entity_id]
      - type: array
        prefixItems:
          - enum: [metric, measure, segment]
          - type: string
        minItems: 2
        maxItems: 2
      # Value literal: [value, literal, options]
      - type: array
        prefixItems:
          - const: value
        minItems: 2
      # Variadic arithmetic: [+/-/*/div, expr, expr, ...] (- also supports unary negation)
      - type: array
        prefixItems:
          - enum: ["+", "-", "*", "/"]
          - $ref: "#/$defs/expression"
        items:
          $ref: "#/$defs/expression"
        minItems: 2
      # Variadic logic: [and/or, expr, expr, ...]
      - type: array
        prefixItems:
          - enum: [and, or]
          - $ref: "#/$defs/expression"
          - $ref: "#/$defs/expression"
        items:
          $ref: "#/$defs/expression"
        minItems: 3
      # Not: [not, expr]
      - type: array
        prefixItems:
          - const: not
          - $ref: "#/$defs/expression"
        minItems: 2
        maxItems: 2
      # Comparison: [op, expr, value, ...]
      - type: array
        prefixItems:
          - enum: ["=", "!=", "<", ">", "<=", ">="]
          - $ref: "#/$defs/expression"
          - $ref: "#/$defs/expression"
        items:
          $ref: "#/$defs/expression"
        minItems: 3
      # Between: [between, expr, min, max]
      - type: array
        prefixItems:
          - const: between
          - $ref: "#/$defs/expression"
          - $ref: "#/$defs/expression"
          - $ref: "#/$defs/expression"
        minItems: 4
        maxItems: 4
      # Inside (geo bounding box): [inside, lat, lon, n, w, s, e]
      - type: array
        prefixItems:
          - const: inside
          - $ref: "#/$defs/expression"
          - $ref: "#/$defs/expression"
          - type: number
          - type: number
          - type: number
          - type: number
        minItems: 7
        maxItems: 7
      # Null/empty checks: [op, expr]
      - type: array
        prefixItems:
          - enum: [is-null, not-null, is-empty, not-empty]
          - $ref: "#/$defs/expression"
        minItems: 2
        maxItems: 2
      # String filters (single value): [op, field, value] or [op, field, value, options]
      - type: array
        prefixItems:
          - enum: [contains, does-not-contain, starts-with, ends-with]
          - $ref: "#/$defs/expression"
          - $ref: "#/$defs/expression"
        items:
          anyOf:
            - $ref: "#/$defs/expression"
            - type: object
              properties:
                case-sensitive:
                  type: boolean
        minItems: 3
        maxItems: 4
      # String filters (multi-value): [op, options, field, value, value, ...]
      - type: array
        prefixItems:
          - enum: [contains, does-not-contain, starts-with, ends-with]
          - type: object
            properties:
              case-sensitive:
                type: boolean
          - $ref: "#/$defs/expression"
          - $ref: "#/$defs/expression"
        items:
          $ref: "#/$defs/expression"
        minItems: 5
      # time-interval: [time-interval, field, n, unit, options?]
      - type: array
        prefixItems:
          - const: time-interval
          - $ref: "#/$defs/expression"
          - anyOf:
              - type: integer
              - enum: [current, last, next]
          - $ref: "common.yaml#/$defs/datetime_truncation_unit"
        items:
          type: object
          description: "Options: {include-current: boolean}"
          properties:
            include-current:
              type: boolean
              description: Include current period (default false)
        minItems: 4
        maxItems: 5
      # relative-time-interval: [op, field, n, unit, offset-n, offset-unit]
      - type: array
        prefixItems:
          - const: relative-time-interval
          - $ref: "#/$defs/expression"
          - type: integer
          - $ref: "common.yaml#/$defs/datetime_truncation_unit"
          - type: integer
          - $ref: "common.yaml#/$defs/datetime_truncation_unit"
        minItems: 6
        maxItems: 6
      # absolute-datetime: [absolute-datetime, value, unit]
      - type: array
        prefixItems:
          - const: absolute-datetime
          - type: string
          - $ref: "common.yaml#/$defs/datetime_bucketing_unit"
        minItems: 3
        maxItems: 3
      # relative-datetime: [relative-datetime, n, unit?]
      - type: array
        prefixItems:
          - const: relative-datetime
          - anyOf:
              - type: integer
              - const: current
        items:
          $ref: "common.yaml#/$defs/datetime_truncation_unit"
        minItems: 2
        maxItems: 3
      # Nullary: [now] or [today]
      - type: array
        prefixItems:
          - enum: [now, today]
        minItems: 1
        maxItems: 1
      # interval: [interval, n, unit]
      - type: array
        prefixItems:
          - const: interval
          - type: integer
          - $ref: "common.yaml#/$defs/datetime_truncation_unit"
        minItems: 3
        maxItems: 3
      # Unary functions
      - type: array
        prefixItems:
          - enum:
              # Math
              - abs
              - ceil
              - floor
              - round
              - sqrt
              - exp
              - log
              # String
              - length
              - trim
              - ltrim
              - rtrim
              - upper
              - lower
              # URL
              - host
              - domain
              - subdomain
              - path
              # Temporal extraction
              - get-year
              - get-quarter
              - get-month
              - get-day
              - get-hour
              - get-minute
              - get-second
              # Type casting
              - text
              - integer
              - float
              - boolean
              # Name extraction
              - day-name
              - month-name
              - quarter-name
          - $ref: "#/$defs/expression"
        minItems: 2
        maxItems: 2
      # Functions with optional week mode: [op, expr, mode?]
      - type: array
        prefixItems:
          - enum: [get-day-of-week, get-week]
          - $ref: "#/$defs/expression"
        items:
          type: string
          enum: [iso, us, instance]
        minItems: 2
        maxItems: 3
      # Power: [power, base, exponent]
      - type: array
        prefixItems:
          - const: power
          - $ref: "#/$defs/expression"
          - $ref: "#/$defs/expression"
        minItems: 3
        maxItems: 3
      # Ternary string fns: [op, str, arg2, arg3]
      - type: array
        prefixItems:
          - enum: [substring, replace, split-part]
          - $ref: "#/$defs/expression"
          - $ref: "#/$defs/expression"
          - $ref: "#/$defs/expression"
        minItems: 4
        maxItems: 4
      # regex-match-first: [regex-match-first, str, pattern]
      - type: array
        prefixItems:
          - const: regex-match-first
          - $ref: "#/$defs/expression"
          - type: string
        minItems: 3
        maxItems: 3
      # Concat: [concat, expr, expr, ...]
      - type: array
        prefixItems:
          - const: concat
          - $ref: "#/$defs/expression"
          - $ref: "#/$defs/expression"
        items:
          $ref: "#/$defs/expression"
        minItems: 3
      # Coalesce: [coalesce, expr, expr, ...]
      - type: array
        prefixItems:
          - const: coalesce
          - $ref: "#/$defs/expression"
          - $ref: "#/$defs/expression"
        items:
          $ref: "#/$defs/expression"
        minItems: 3
      # Datetime arithmetic: [datetime-add/subtract, expr, n, unit]
      - type: array
        prefixItems:
          - enum: [datetime-add, datetime-subtract]
          - $ref: "#/$defs/expression"
          - type: integer
          - $ref: "common.yaml#/$defs/datetime_truncation_unit"
        minItems: 4
        maxItems: 4
      # Datetime diff: [datetime-diff, expr1, expr2, unit]
      - type: array
        prefixItems:
          - const: datetime-diff
          - $ref: "#/$defs/expression"
          - $ref: "#/$defs/expression"
          - $ref: "#/$defs/datetime_diff_unit"
        minItems: 4
        maxItems: 4
      # Convert timezone: [convert-timezone, expr, target-tz, source-tz?]
      - type: array
        prefixItems:
          - const: convert-timezone
          - $ref: "#/$defs/expression"
          - type: string
        items:
          type: string
        minItems: 3
        maxItems: 4
      # Temporal extract: [temporal-extract, expr, unit, mode?]
      - type: array
        prefixItems:
          - const: temporal-extract
          - $ref: "#/$defs/expression"
          - $ref: "common.yaml#/$defs/datetime_extraction_unit"
        items:
          type: string
          enum: [iso, us, instance]
        minItems: 3
        maxItems: 4
      # count/cum-count/cum-sum: [op] or [op, expr]
      - type: array
        prefixItems:
          - enum: [count, cum-count, cum-sum]
        items:
          $ref: "#/$defs/expression"
        minItems: 1
        maxItems: 2
      # Unary aggregations: [op, expr]
      - type: array
        prefixItems:
          - enum: [sum, avg, min, max, distinct, stddev, var, median]
          - $ref: "#/$defs/expression"
        minItems: 2
        maxItems: 2
      # Percentile: [percentile, expr, p]
      - type: array
        prefixItems:
          - const: percentile
          - $ref: "#/$defs/expression"
          - type: number
        minItems: 3
        maxItems: 3
      # Conditional aggregations
      - type: array
        prefixItems:
          - enum: [count-where, share]
          - $ref: "#/$defs/expression"
        minItems: 2
        maxItems: 2
      - type: array
        prefixItems:
          - enum: [sum-where, distinct-where]
          - $ref: "#/$defs/expression"
          - $ref: "#/$defs/expression"
        minItems: 3
        maxItems: 3
      # aggregation-options: [aggregation-options, agg, {display-name: ...}]
      - type: array
        prefixItems:
          - const: aggregation-options
          - $ref: "#/$defs/expression"
          - type: object
            properties:
              display-name:
                type: string
                description: Custom display name for the aggregation
              name:
                type: string
                description: Internal name for the aggregation
        minItems: 3
        maxItems: 3
      # Case/if: [case/if, [[cond, val], ...], default?]
      - type: array
        prefixItems:
          - enum: [case, if]
          - type: array
            items:
              type: array
              prefixItems:
                - $ref: "#/$defs/expression"
                - $ref: "#/$defs/expression"
              minItems: 2
              maxItems: 2
        items:
          $ref: "#/$defs/expression"
        minItems: 2
        maxItems: 3
      # Offset: [offset, expr, n]
      - type: array
        prefixItems:
          - const: offset
          - $ref: "#/$defs/expression"
          - type: integer
        minItems: 3
        maxItems: 3
      # Order-by direction: [asc/desc, expr]
      - type: array
        prefixItems:
          - enum: [asc, desc]
          - $ref: "#/$defs/expression"
        minItems: 2
        maxItems: 2

  datetime_diff_unit:
    description: Units for datetime-diff (no millisecond).
    type: string
    enum: [second, minute, hour, day, week, month, quarter, year]

  join:
    type: object
    description: A join clause combining data from another table or query.
    properties:
      source-table:
        description: Table FK or Card entity_id of the joined data source
        oneOf:
          - description: Table FK [database, schema, table]
            $ref: "common.yaml#/$defs/table_id"
          - description: Card entity_id (NanoID)
            $ref: "common.yaml#/$defs/entity_id"
      condition:
        description: Join condition as MBQL expression clause
        $ref: "#/$defs/expression"
      alias:
        type: string
        description: Join alias for referencing joined columns
      strategy:
        type: string
        description: Join strategy
        enum:
          - left-join
          - right-join
          - inner-join
          - full-join
      fields:
        description: >
          Which fields to include from the joined table. "all" for all,
          "none" for none, or an array of field reference clauses.
        oneOf:
          - type: string
            enum:
              - all
              - none
          - type: array
            items:
              $ref: "#/$defs/expression"

  native_query:
    type: object
    description: A native SQL query with optional template tags for parameterization.
    required:
      - query
    properties:
      query:
        type: string
        description: SQL query string, may contain {{tag}} placeholders
      template-tags:
        type: object
        description: >
          Template tag definitions. Keys match {{tag}} placeholders in the
          SQL query string.
        additionalProperties:
          $ref: "#/$defs/template_tag"

  template_tag:
    type: object
    description: A template tag for parameterizing native SQL queries.
    required:
      - type
      - name
      - id
    properties:
      type:
        type: string
        description: Tag type
        enum:
          - text
          - number
          - date
          - boolean
          - dimension
          - temporal-unit
          - card
          - snippet
          - table
      name:
        type: string
        description: Tag name (matches the {{name}} placeholder)
      id:
        type: string
        description: UUID identifier
        format: uuid
      display-name:
        type: string
        description: Human-readable label
      default:
        description: Default value (type depends on tag type)
      required:
        type: boolean
        description: Whether a value is required
      dimension:
        description: Field reference for dimension type
        $ref: "#/$defs/expression"
      widget-type:
        type: string
        description: Filter widget type (e.g., string/=, date/range)
      options:
        type: object
        description: Options for generated filter clause (e.g., case-sensitive)
      alias:
        type: string
        description: >
          Name used to reference this expression in SQL
          (for temporal-unit and dimension tags)
      card-id:
        description: Card entity_id for card type tags
        $ref: "common.yaml#/$defs/entity_id"
      snippet-name:
        type: string
        description: Snippet name for snippet type tags
      snippet-id:
        description: Snippet entity_id for snippet type tags
        $ref: "common.yaml#/$defs/entity_id"
      table-id:
        description: Table FK for table type tags
        $ref: "common.yaml#/$defs/table_id"
      emit-alias:
        type: boolean
        description: Whether to emit the table name as an alias (for table tags)
