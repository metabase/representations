$schema: https://json-schema.org/draft/2020-12/schema
title: Common
description: Shared type definitions for entity identifiers and foreign keys.

$defs:
  entity_id:
    type: string
    description: NanoID identifier (21 characters, alphabet A-Za-z0-9_-)
    pattern: "^[A-Za-z0-9_-]{21}$"

  user_id:
    type: string
    description: User FK (email address)
    format: email

  database_id:
    type: string
    description: Database FK (database name)

  table_id:
    type: array
    description: Table FK [database, schema, table]
    items:
      type:
        - string
        - "null"
    minItems: 3
    maxItems: 3
