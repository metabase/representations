name: Import

on:
  push:
    branches: [main]
  pull_request:

jobs:
  import-test:
    runs-on: ubuntu-latest

    env:
      MB_PREMIUM_EMBEDDING_TOKEN: ${{ secrets.MB_PREMIUM_EMBEDDING_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Pull Metabase
        run: docker pull metabase/metabase-enterprise:latest

      - name: Setup and import
        run: |
          MB_DIR="$RUNNER_TEMP/metabase-data"
          mkdir -p "$MB_DIR"

          # Start Metabase to complete first-time setup
          docker run -d --name metabase \
            -e MB_PREMIUM_EMBEDDING_TOKEN \
            -e MB_DB_TYPE=h2 \
            -e MB_DB_FILE=/data/metabase \
            -v "$MB_DIR:/data" \
            -p 3000:3000 \
            metabase/metabase-enterprise:latest

          echo "Waiting for Metabase to start..."
          timeout 180 bash -c '
            until curl -sf http://localhost:3000/api/health | grep -q ok; do
              sleep 2
            done
          '

          # Complete first-time setup
          SETUP_TOKEN=$(curl -sf http://localhost:3000/api/session/properties | jq -r '.["setup-token"]')
          curl -sf http://localhost:3000/api/setup -X POST \
            -H 'Content-Type: application/json' \
            -d "$(jq -n --arg token "$SETUP_TOKEN" '{
              token: $token,
              user: {email:"admin@test.com", password:"Metabase123!", first_name:"Admin", last_name:"User", site_name:"Test"},
              prefs: {site_name:"Test", site_locale:"en", allow_tracking:false}
            }')" > /dev/null
          echo "Setup complete"

          # Stop Metabase — H2 must be fully released before CLI import
          docker stop metabase
          docker rm metabase

          # Verify H2 file exists
          ls -la "$MB_DIR"/metabase.mv.db

          # Run import against the same H2 database
          docker run --rm \
            -e MB_PREMIUM_EMBEDDING_TOKEN \
            -e MB_DB_TYPE=h2 \
            -e MB_DB_FILE=/data/metabase \
            -v "$MB_DIR:/data" \
            -v "${{ github.workspace }}/examples/v1:/import" \
            --entrypoint java \
            metabase/metabase-enterprise:latest \
            -jar /app/metabase.jar import /import
