name: Publish Alpha from Branch

# Adding the publish-alpha label to a PR from this repository publishes the PR
# head as <version>-alpha.br-<branch>.sha-<sha> under the dist-tag alpha-<branch>.
# Labelling a commit already published publishes nothing.
# The latest dist-tag is untouched; releases still come from main (release.yml).

on:
  pull_request:
    types: [labeled]

jobs:
  publish-alpha:
    if: github.event.label.name == 'publish-alpha' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup Node.js with npm registry
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.9"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The branch name is attacker-shaped text: git refs may contain `$`, `(`, `;` and backticks.
      # Pass it through env so the shell sees it as data, never as script.
      - name: Compute alpha version and dist-tag
        id: version
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          BASE=$(node -p "require('./package.json').version")
          bash scripts/alpha-version.sh "$BASE" "$HEAD_REF" "$(git rev-parse --short HEAD)" | tee -a "$GITHUB_OUTPUT"

      # npm refuses to publish a version twice, so labelling a commit again would fail here.
      - name: Check whether the version is published
        id: published
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ -n "$(npm view "@metabase/representations@$VERSION" version 2>/dev/null)" ]; then
            echo "@metabase/representations@$VERSION is already published"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set package version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: npm pkg set version="$VERSION"

      - name: Build
        run: bun run build

      # Only this step has the npm token in its environment, but the steps above ran the PR's code,
      # which can change what this step runs ($GITHUB_ENV, $GITHUB_PATH, an .npmrc). Anyone who can
      # push a branch to this repository controls this job, the token included. --ignore-scripts
      # stops only package lifecycle scripts; the tarball is packed from the dist/ built above. The
      # package has no prepublishOnly script to run beforehand.
      - name: Publish to NPM
        if: steps.published.outputs.exists == 'false'
        run: npm publish --ignore-scripts --tag "$TAG" --access public
        env:
          TAG: ${{ steps.version.outputs.tag }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_RELEASE_TOKEN }}

      - name: Remove label
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api \
            -X DELETE \
            "/repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels/publish-alpha" \
            || true

      - name: Comment on PR
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          EXISTED: ${{ steps.published.outputs.exists }}
        run: |
          if [ "$EXISTED" = "true" ]; then VERB="Already published"; else VERB="Published"; fi
          # shellcheck disable=SC2016 # the backticks are Markdown, not command substitution
          BODY=$(printf '%s `@metabase/representations@%s` with dist-tag `%s`.\n\nInstall: `npm install @metabase/representations@%s`' "$VERB" "$VERSION" "$TAG" "$TAG")
          gh pr comment "$PR_NUMBER" -R "$GITHUB_REPOSITORY" --body "$BODY"

      - name: Generate workflow summary
        if: always()
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # shellcheck disable=SC2016 # the backticks are Markdown, not command substitution
          {
            printf '## @metabase/representations alpha publish\n\n'
            printf -- '- **Branch**: %s\n' "$HEAD_REF"
            printf -- '- **Version**: %s\n' "$VERSION"
            printf -- '- **Dist-tag**: %s\n' "$TAG"
            printf -- '- **Install**: `npm install @metabase/representations@%s`\n' "$TAG"
          } >> "$GITHUB_STEP_SUMMARY"
