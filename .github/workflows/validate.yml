name: Validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"

      - run: bun install --frozen-lockfile

      - run: bun run bin/cli.ts validate-schema --folder examples/v1
