name: Metabase sources

# The lint parses SQL with Metabase's own code: vendor/sql_tools.py must stay
# byte-identical to Metabase's on master, and the vendored SQLGlot wheel at
# Metabase's pin, with PyPI's SHA-256. Metabase changes on its own schedule, so
# the check also runs daily.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read

jobs:
  check-metabase-sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"
      - run: bun install --frozen-lockfile
      - run: bun run scripts/check-metabase-sources.ts
