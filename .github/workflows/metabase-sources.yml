name: Metabase sources

# The lint parses SQL with Metabase's own code: vendor/sql_tools.py must stay
# byte-identical to Metabase's on master, the vendored SQLGlot wheel at
# Metabase's pin, with PyPI's SHA-256, and IMPORTED_MODELS Metabase's
# exported-models. Every pull request and push to main checks them; the daily
# run finds a change Metabase makes between pull requests. When sql_tools.py
# differs, `bun run scripts/update-metabase-sources.ts` copies it.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read

jobs:
  check-metabase-sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"
      - run: bun install --frozen-lockfile
      - name: Check every copied source, sql_tools.py byte for byte
        run: bun run scripts/check-metabase-sources.ts
